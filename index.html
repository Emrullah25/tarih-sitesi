{name:"Kanuni Sultan Süleyman",category:"Osmanlı",info:["6 Kasım 1494 Trabzon doğdu."," 7 Eylül 1566 Zigetvar Kuşatması sırasında vefat etti."," 1520 ile 1566 yılları arasında 46 yıl boyunca tahtta kalarak Osmanlı tarihinde en uzun süre hüküm süren padişah olmuştur. ","Adaletli yönetiminden dolayı Doğulular tarafından Kanuni, Avrupa dünyasında ise muhteşemlığinden ötürü Muhteşem Süleyman olarak adlandırılmıştır.","Toplam 13 büyük sefere çıkmış, saltanatının yaklaşık 10 yılını seferlerde geçirmiştir.","YAPTIĞI FETİHLER"," - Belgrad'ın fethi (1521)"," - Rodos'un fethi (1522)"," - Mohaç Meydan Muharebesi (1526 - Macaristan'ın fethi)"," - Viyana Kuşatması (1529 - başarısız sonuçlanmıştır)"," - Preveze Deniz Zaferi (1538)"]},
{name:"Barbaros Hayreddin Paşa",category:"Osmanlı",info:["1478 yılında Midilli’de doğdu.","5 Temmuz 1546 yılında İstanbul'da vefat etti. Türbesi Mimar Sinan tarafından Beşiktaş'ta yapılmıştır","Barbaros Hayrettin Paşa (asıl adı Hızır Reis)","Osmanlı İmparatorluğu'nun ilk kaptan paşası ve 25. Kaptan-ı Deryâsıdır."," Abisi Oruç Reis ile birlikte Akdeniz’de deniz ticareti ve korsanlık yaptılar.","1516-1517 yıllarında Oruç Reis ile birlikte Cezayir’i ele geçirdiler. Oruç Reis’in şehadetinden sonra Hızır Reis, Cezayir'i Osmanlı egemenliğine bağladı.","Yavuz Sultan Selim döneminde kendisine dinin hayırlısı anlamında Hayrettin ismi verildi. Avrupalılar ise kızıl sakalından dolayı ona Barbarossa lakabını taktı.","Haçlı donanmasına karşı Preveze Deniz Muharebesi'ni kazanarak Akdeniz’i adeta bir Türk gölü haline getirdi."]},

{name:"Osman Gazi",category:"Osmanlı",info:["1258 yılında Söğüt'te doğdu."," İlerleleyen yaşı ve gut hastalığı nedeniyle yönetimi oğlu Orhan Bey'e devretti. 1324 (bazı kaynaklara göre 1326) yılında vefat etti ve naaşı Bursa'daki Gümüşlü Kümbet'e nakledildi."," 1281 yılında babası Ertuğrul Gazi'nin vefatı üzerine 23 yaşındayken Kayı obasının lideri oldu.","1299 yılında İnegöl ve çevresindeki fetihlerle Söğüt ve Domaniç'teki aşireti bağımsız bir beyliğe ve devlete dönüştürdü."," Söğüt ve Yenişehir'de kendi adına ilk gümüş akçeyi bastırdı.","Yönetimi döneminde beyliğin topraklarını yaklaşık 4.800 km²'den 16.000 km²'ye çıkardı.","YAPTIĞI FETİHLER"," - 1286 Domaniç Muharebesi ve Karacahisar fethi"," -1302 yılında Bizans'a karşı Bafeus (Koyunhisar) Muharebesi zaferi"," - Bilecik, Yarhisar ve Yenişehir'in ele geçirilmesi"]},
{name:"Napolyon",category:"Tarihi Liderler",info:["15 Ağustos 1769'da Fransa'ya bağlı Korsika adasının Ajaccio şehrinde doğdu.","5 Mayıs 1821'de Saint Helena'da hayatını kaybetti.","1804 yılında kendisini Fransa İmparatoru ilan etti. Austerlitz (1805) gibi pek çok büyük zafer kazandı.","Bugün modern hukuk sistemlerinin temelini oluşturan Napolyon Kanunnamesi'ni (Medeni Kanun) hazırlattı, eğitim ve idari sistemde büyük reformlar yaptı.","1812'deki başarısız Rusya Seferi'nin ardından zayıfladı.","1814'te tahttan indirilip Elba Adası'na sürgün edildi.","1815'teki kısa dönüşü ve Waterloo Savaşı'ndaki yenilgisinin ardından Güney Atlantik'teki Saint Helena Adası'na sürgün edildi."]},
{name:"George Washington",category:"Tarihi Liderler",info:["ABD'nin ilk başkanı."]},

{name:"İbn Sina",category:"Bilim",info:["Tıp alanında önemli eserler yazdı."]},

{name:"Kant",category:"Felsefe",info:["Eleştirel felsefe."]},

{name:"Orhan Gazi",category:"Osmanlı",info:["Osmanlı'nın ikinci padişahıdır.","Bursa'yı fethetti."]},
{name:"I. Murad",category:"Osmanlı",info:["Kosova Savaşı'nı kazandı.","Osmanlı'yı Balkanlara taşıdı."]},
{name:"Yıldırım Bayezid",category:"Osmanlı",info:["Anadolu birliğini sağlamaya çalıştı.","Niğbolu Savaşı'nı kazandı."]},
{name:"Çelebi Mehmet",category:"Osmanlı",info:["Fetret Devri'ni bitirdi.","Osmanlı'yı yeniden toparladı."]},
{name:"II. Murad",category:"Osmanlı",info:["Varna Savaşı'nı kazandı.","Fatih'in babasıdır."]},

{name:"II. Bayezid",category:"Osmanlı",info:["Osmanlı'da huzur dönemi yaşandı."]},
{name:"III. Selim",category:"Osmanlı",info:["Nizam-ı Cedid reformlarını başlattı."]},
{name:"II. Mahmud",category:"Osmanlı",info:["Yeniçeri Ocağı'nı kaldırdı."]},
{name:"Abdülmecid",category:"Osmanlı",info:["Tanzimat Fermanı döneminin padişahı."]},
{name:"Abdülhamid II",category:"Osmanlı",info:["Uzun süre padişahlık yaptı.","Eğitim ve demiryolu projeleri geliştirdi."]}
  
];

const listDiv = document.getElementById('list');
let currentCategory = "all";

function renderList(arr){
  listDiv.innerHTML='';
  arr.forEach(p=>{
    const d=document.createElement('div');
    d.className='person';
    d.innerText=p.name;
    d.onclick=()=>openDetail(p);
    listDiv.appendChild(d);
  });
}

function openDetail(p){
  document.getElementById('detailPage').style.display='block';
  document.getElementById('detailName').innerText=p.name;
  const ol=document.getElementById('detailInfo');
  ol.innerHTML='';
  p.info.forEach(i=>{
    const li=document.createElement('li');
    li.innerText=i;
    ol.appendChild(li);
  });
}

function closeDetail(){
  document.getElementById('detailPage').style.display='none';
}

function filterCategory(cat){
  currentCategory = cat;
  applyFilters();
}

function searchPerson(){
  applyFilters();
}

function applyFilters(){
  const val=document.getElementById('searchBox').value.toLowerCase();
  let result=people;

  if(currentCategory!=="all"){
    result=result.filter(p=>p.category===currentCategory);
  }

  result=result.filter(p=>p.name.toLowerCase().includes(val));
  renderList(result);
}

renderList(people);
  console.log(people);
console.log("Kişi sayısı:", people.length);

</script>
</body>
