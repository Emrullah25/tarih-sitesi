const people = [

{name:"Fatih Sultan Mehmet",category:"Osmanlı",info:["Osmanlı İmparatorluğu'nun 7.padişahıdır.","30 Mart 1432 tarihinde Edirne'de doğmuş.","3 Mayıs 1481'de vefat etmiştir.","21 yaşında, 29 Mayıs 1453'te İstanbul'u fethetti ve 1125 yıllık Doğu Roma (Bizans) İmparatorluğu'na son vermiştir.","İstanbul'un fethiyle ilgili hadislerde müjdelenen komutan olarak kabul edilir..","İstanbul'un fethinden sonra Fatih unvanını aldı.","Saltanatı boyunca bizzat 25 sefere katılmış; Sırbistan, Mora, Trabzon, Eflak, Bosna, Arnavutluk, Kırım ve Akkoyunlular üzerine düzenlediği seferlerle imparatorluk topraklarını 880 bin kilometrekareden 2,2 milyon kilometrekareye çıkararak devleti cihan imparatorluğu seviyesine yükseltmiştir.","Felsefe, matematik, din bilimleri alanlarında eğitim almış ve çok sayıda dil bilmiştir.","Kanunnâme-i Al-i Osman'ı hazırlatarak devlet teşkilatını düzenlemiş, İstanbul'da Sahn-ı Seman Medreseleri'ni ve Fatih Külliyesi'ni kurmuştur."]},
{name:"Yavuz Sultan Selim",category:"Osmanlı",info:["Osmanlı İmparatorluğu'nun 9. padişahı ve ilk Osmanlı halifesidir.","1470 yılında Amasya’da doğdu","Babası II. Bayezid, annesi Gülbahar Hatun'dur.","1512-1520 yılları arasında yaklaşık 8 yıl hüküm sürdü."," Yeniçerilerin desteğiyle babası II. Bayezid'i tahttan indirerek 1512 yılında padişah oldu.","Safevi Hükümdarı Şah İsmail'i yenerek Doğu Anadolu'daki Şii tehdidini azalttı","Memlük Sultanlığı'nı ortadan kaldırarak Suriye, Filistin, Mısır ve Hicaz bölgelerini Osmanlı topraklarına kattı.","Memlüklerin son bulmasıyla İslâm halifeliği Osmanlı padişahlarına geçti.","kutsal emanetler İstanbul’a getirildi.","Baharat Yolu Osmanlı denetimine girdi.","Sert ve kararlı yönetim tarzı nedeniyle Yavuz lakabını almıştır."]},
{name:"Kanuni Sultan Süleyman",category:"Osmanlı",info:["6 Kasım 1494 Trabzon doğdu."," 7 Eylül 1566 Zigetvar Kuşatması sırasında vefat etti."," 1520 ile 1566 yılları arasında 46 yıl boyunca tahtta kalarak Osmanlı tarihinde en uzun süre hüküm süren padişah olmuştur. ","Adaletli yönetiminden dolayı Doğulular tarafından Kanuni, Avrupa dünyasında ise muhteşemlığinden ötürü Muhteşem Süleyman olarak adlandırılmıştır.","Toplam 13 büyük sefere çıkmış, saltanatının yaklaşık 10 yılını seferlerde geçirmiştir.","YAPTIĞI FETİHLER"," - Belgrad'ın fethi (1521)"," - Rodos'un fethi (1522)"," - Mohaç Meydan Muharebesi (1526 - Macaristan'ın fethi)"," - Viyana Kuşatması (1529 - başarısız sonuçlanmıştır)"," - Preveze Deniz Zaferi (1538)"]},
{name:"Barbaros Hayreddin Paşa",category:"Osmanlı",info:["1478 yılında Midilli’de doğdu.","5 Temmuz 1546 yılında İstanbul'da vefat etti. Türbesi Mimar Sinan tarafından Beşiktaş'ta yapılmıştır","Barbaros Hayrettin Paşa (asıl adı Hızır Reis)","Osmanlı İmparatorluğu'nun ilk kaptan paşası ve 25. Kaptan-ı Deryâsıdır."," Abisi Oruç Reis ile birlikte Akdeniz’de deniz ticareti ve korsanlık yaptılar.","1516-1517 yıllarında Oruç Reis ile birlikte Cezayir’i ele geçirdiler. Oruç Reis’in şehadetinden sonra Hızır Reis, Cezayir'i Osmanlı egemenliğine bağladı.","Yavuz Sultan Selim döneminde kendisine dinin hayırlısı anlamında Hayrettin ismi verildi. Avrupalılar ise kızıl sakalından dolayı ona Barbarossa lakabını taktı.","Haçlı donanmasına karşı Preveze Deniz Muharebesi'ni kazanarak Akdeniz’i adeta bir Türk gölü haline getirdi."]},

{name:"Osman Gazi",category:"Osmanlı",info:["1258 yılında Söğüt'te doğdu."," İlerleleyen yaşı ve gut hastalığı nedeniyle yönetimi oğlu Orhan Bey'e devretti. 1324 (bazı kaynaklara göre 1326) yılında vefat etti ve naaşı Bursa'daki Gümüşlü Kümbet'e nakledildi."," 1281 yılında babası Ertuğrul Gazi'nin vefatı üzerine 23 yaşındayken Kayı obasının lideri oldu.","1299 yılında İnegöl ve çevresindeki fetihlerle Söğüt ve Domaniç'teki aşireti bağımsız bir beyliğe ve devlete dönüştürdü."," Söğüt ve Yenişehir'de kendi adına ilk gümüş akçeyi bastırdı.","Yönetimi döneminde beyliğin topraklarını yaklaşık 4.800 km²'den 16.000 km²'ye çıkardı.","YAPTIĞI FETİHLER"," - 1286 Domaniç Muharebesi ve Karacahisar fethi"," -1302 yılında Bizans'a karşı Bafeus (Koyunhisar) Muharebesi zaferi"," - Bilecik, Yarhisar ve Yenişehir'in ele geçirilmesi"]},
{name:"Napolyon",category:"Tarihi Liderler",info:["15 Ağustos 1769'da Fransa'ya bağlı Korsika adasının Ajaccio şehrinde doğdu.","5 Mayıs 1821'de Saint Helena'da hayatını kaybetti.","1804 yılında kendisini Fransa İmparatoru ilan etti. Austerlitz (1805) gibi pek çok büyük zafer kazandı.","Bugün modern hukuk sistemlerinin temelini oluşturan Napolyon Kanunnamesi'ni (Medeni Kanun) hazırlattı, eğitim ve idari sistemde büyük reformlar yaptı.","1812'deki başarısız Rusya Seferi'nin ardından zayıfladı.","1814'te tahttan indirilip Elba Adası'na sürgün edildi.","1815'teki kısa dönüşü ve Waterloo Savaşı'ndaki yenilgisinin ardından Güney Atlantik'teki Saint Helena Adası'na sürgün edildi."]},
{name:"George Washington",category:"Tarihi Liderler",info:["22 Şubat 1732'de Virginia Kolonisi'nde, zengin bir tütün çiftçisi ailenin çocuğu olarak dünyaya geldi.","11 yaşında babasını kaybetti.","Uzun süreli eğitim hayatı olmadı.","Kendi kendini geliştirerek matematik,arazi ölçümü ve haritacılık alanlarında uzmanlaştı.","Genç yaşta milis kuvvetlerine katıldı.","Fransız ve Hint Savaşı sürencinde askeri deneyim kazandı","Direnç ve gerilla taktikleriyle Britanya İmparatorluğu güçlerine karşı Amerikan kolonilerinin zafer kazanmasını sağladı.","1787 Anayasa Konvansiyonu'na başkanlık ettikten sonra,1789'da oy birliğiyle ABD'nin (Amerika Birleşik Devleti) ilk başkanı seçildi."," Başkanlık görevinden sonra Virginia'daki Mount Vernon çiftliğine çekildi ve 14 Aralık 1799'da hayatını kaybetti."]},
{name:"Nelson Mandela",category:"Tarihi Liderler",info:["18 Temmuz 1918'de Güney Afrika’nın Mvezo köyünde doğdu.","Witwatersrand Üniversitesi'nde hukuk eğitimi alarak ülkenin ilk siyahi avukatlarından biri oldu.","1944 yılında Afrika Ulusal Kongresi’ne (ANC) katıldı. Ülkedeki beyaz azınlık hükümetinin siyahlara uyguladığı sistematik ırk ayrımcılığına (apartheid) karşı barışçıl ve silahlı direniş yürüttü.","Yaptığı faaliyetler nedeniyle 1964 yılında müebbet hapis cezasına çarptırıldı. Robben Adası da dahil olmak üzere 27 yıl boyunca hapis kaldı.","1990 yılında cezaevinden tahliye edildi.","Apartheid rejiminin barışçıl bir şekilde sona erdirilmesindeki rolü nedeniyle 1993 yılında Nobel Barış Ödülü'nü kazandı.","1994 yılında Güney Afrika’nın ilk demokratik ve çok ırklı seçimlerinde cumhurbaşkanı seçildi ve bu görevi 1999 yılına kadar sürdürdü.","5 Aralık 2013 tarihinde Johannesburg’da 95 yaşında hayatını kaybetti."]},

{name:"İbn Sina",category:"Bilim",info:["MS 980 yılında Buhara yakınlarındaki Efşene kasabasında (bugünkü Özbekistan) doğdu."," Haziran 1037'de Hamedan'da (bugünkü İran) 57 yaşında vefat etti.","Batı’da Filozofların Prensizi İslam dünyasında ise Eş-Şeyhü'r-Reis (Başkan/Üstat) olarak adlandırıldı.","Küçük yaşta hafız oldu.","16 yaşında tıp öğrenimini tamamladı.","18 yaşında ise döneminin hükümdarlarını tedavi ederek saray hekimi oldu.","felsefe, astronomi, fizik, kimya, psikoloji, mantık ve matematik alanlarında da pek çok eser verdi.","Hayatı boyunca yaklaşık 200 kadar eser kaleme aldığı bilinmektedir.","El-Kanûn fit-Tıb (Tıbbın Kanunu): 5 ciltlik dev bir tıp ansiklopedisidir.","Kitabü’ş-Şifa (İyileşme Kitabı): Mantık, fizik, matematik ve metafizik konularını içeren kapsamlı bir felsefe ve bilim ansiklopedisidir.","En-Necât: Felsefe ve mantık özetidir.","Risale fi’l-Hıfzıssıhha: Sağlığı koruma ve koruyucu hekimlik üzerine yazılmış bir eserdir.",]},
{name:"Einstein",category:"Bilim",info:["14 Mart 1879'da Almanya'nın Ulm şehrinde Yahudi bir ailenin çocuğu olarak dünyaya geldi.","Çocukluk yıllarında geç konuşmasıyla bilinir.,1900 yılında Zürih Federal Teknoloji Enstitüsünden (ETH Zürih) mezun oldu.","1905 yılında fizik dünyasını kökten sarsan dört çığır açıcı makale yayımladı (fotoelektrik etki, Brown hareketi, özel görelilik ve kütle-enerji denkliği)."," 1933 yılında Nazi Almanyası'nın yükselişi ve Yahudi karşıtı politikaları nedeniyle ABD'ye göç etti.","1955 yılında New Jersey'de hayatını kaybetti."," Işığın tanecikli yapısını (foton) açıklayan çalışmaları sayesinde 1921 Nobel Fizik Ödülü'ne layık görüldü.","Kuantum teorisine katkılar, Bose-Einstein istatistikleri, kahverengi hareketinin açıklaması ve az bilinen bir icat olan çevre dostu/enerji gerektirmeyen buzdolabı tasarımı gibi alanlarda da çalışmaları vardır."]},
{name:"Nikola Tesla",category:"Bilim",info:["10 Temmuz 1856’da o zamanki Avusturya İmparatorluğu sınırları içinde yer alan Smiljan (günümüzde Hırvatistan) köyünde doğdu.","Graz Teknik Üniversitesi ve Prag Üniversitesi’nde eğitim gördü.","1884 yılında Amerika Birleşik Devletleri’ne göç etti ve bir süre Thomas Edison ile birlikte çalıştı; ancak fikir ayrılıkları nedeniyle yolları ayrıldı.","7 Ocak 1943'te New York'taki New Yorker Hotel’de hayatını kaybetti.","Elektriğin uzun mesafelere çok daha güvenli ve yüksek verimle taşınmasını sağlayan sistemi geliştirdi.","Yüksek frekans ve yüksek voltaj üreten, kablosuz enerji ve iletişim deneylerinde temel teşkil eden cihaz.","Sanayi elektrik motorlarının temelini oluşturan 3 fazlı AC motor sistemini icat etti.","Radyo dalgaları ve uzaktan kumanda teknolojileri üzerinde öncü deneyler yaptı."," Wardenclyffe Kulesi gibi projelerle elektriği kablosuz olarak geniş kitlelere ulaştırmayı amaçladı.","Tesla’nın savunduğu Alternatif Akım (AC) ile Edison’un savunduğu Doğru Akım (DC) arasında 19. yüzyılın sonlarında büyük bir rekabet yaşandı (Günümüzde elektrik şebekelerinde AC sistemi kullanıldığı için bu mücadeleyi Tesla kazanmış sayılmaktadır)."]},
{name:"Marie Curie",category:"Bilim",info:["7 Kasım 1867'de Polonya'nın Varşova şehrinde dünyaya geldi.","O dönemde Polonya'da kadınların üniversiteye gitmesi yasak olduğundan, kadınlara gizli eğitim veren yeraltındaki Uçan Üniversite'de okudu.","Daha sonra eğitimine devam etmek için Paris’e giderek Sorbonne Üniversitesi'nde fizik ve matematik eğitimi aldı.","1895 yılında fizikçi Pierre Curie ile evlendi ve bilimsel çalışmalarına birlikte yön verdiler.","Henri Becquerel'in keşfettiği uranyum ışınlarını detaylandırarak -radyoaktivite- terimini bilim dünyasına kazandırdı.","Eşi Pierre Curie ile birlikte uranyumun yanı sıra polonyum ve radyum elementlerini keşfettiler."," I. Dünya Savaşı sırasında yaralı askerlerin tespiti için kızı Irène ile birlikte mobil röntgen (X-ray) araçları (Küçük Curie'ler) geliştirdi.","Eşi Pierre Curie ve Henri Becquerel ile birlikte kazandı. Bu ödülü alan ilk kadın oldu.","Uzun yıllar boyunca radyasyona korumasız şekilde maruz kalması sonucunda gelişen aplastik anemi nedeniyle 4 Temmuz 1934'te Fransa'da hayatını kaybetti."]},

{name:"Sokrates",category:"Felsefe",info:["Atina'nın Alopeke bölgesinde doğdu.","Gençliğinde heykeltıraşlık yaptığı ve bazı savaşlara asker olarak katıldığı bilinmektedir."," Sokrates kendi elleriyle hiçbir yazılı eser bırakmamıştır."," Sokrates kendi elleriyle hiçbir yazılı eser bırakmamıştır. Onun hakkındaki tüm bilgiler ve felsefesi, öğrencileri Platon ve Ksenofon ile Aristoteles ve Aristophanes'in aktardıklarıyla günümüze ulaşmıştır."," Karşısındakine sorular sorarak bildiğini sandığı şeyleri aslında bilmediğini fark ettirmeyi amaçlayan bir -çürütme- ve  yöntemi kullanmıştır."," Delphoi Tapınağı'ndaki bu sözü felsefesinin merkezine koymuş, erdemin bilgiyle, kötülüğün ise cehaletle ilgili olduğunu öne sürmüştür.","İncelenmemiş bir yaşam yaşanmaya değmez sözüyle felsefi sorgulamanın insan hayatı için şart olduğunu vurgulamıştır.","MÖ 399 yılında Atina'da devletin tanrılarına inanmamak, yeni tanrılar icat etmek ve gençlerin ahlakını bozmak suçlamalarıyla yargılandı.","Mahkemede savunmasını yapmış olmasına rağmen idama mahkûm edildi. Hapishaneden kaçma tekliflerini reddetti ve yasalara sadık kalarak kamuoyunun önünde baldıran zehri içerek idam edildi."]},
{name:"Platon",category:"Felsefe",info:["Aristokles'tir. Geniş omuzlu veya geniş alınlı olması nedeniyle -Platon- (geniş göğüslü) lakabını almıştır.","MÖ 387 yılında Atina'da Batı dünyasının ilk yükseköğretim kurumu kabul edilen Akademi'yi (Akademeia) kurmuştur.","MÖ 387 yılında Atina'da Batı dünyasının ilk yükseköğretim kurumu kabul edilen Akademi'yi (Akademeia) kurmuştur.","İdealar Teorisi: Duyularla algıladığımız fiziksel dünya (görünüşler alemi) yanıltıcıdır; gerçek varlıklar değişmeyen, sonsuz ve soyut olan İdealar Dünyası'na aittir.","Mağara Metaforu: İnsanların gerçeği değil, duvarda yansıyan gölgeleri gerçek sandığını anlattığı ünlü alegorisidir.","Demokrasiye mesafeli yaklaştığı ünlü eseri Devlet’te (Politeia), toplumu ve devleti bilge kişilerin yani filozof-kralların yönetmesi gerektiğini savunur. Toplumu da altın (yöneticiler), gümüş (koruyucular/askerler) ve bronz (üreticiler) olmak üzere sınıflara ayırır.","Eserleri","-Devlet (Politeia)-","-Sokrates'in Savunması (Apologia)-","-Phaidon (Ruhun ölümsüzlüğü üzerine)-","-Phaidros-"]},
{name:"Aristoteles",category:"Felsefe",info:["MÖ 384 yılında Antik Yunanistan'ın kuzeyinde, Makedonya bölgesindeki Stagira şehrinde dünyaya geldi. Bu nedenle bazı kaynaklarda Stagirli Aristoteles olarak da anılır.","Babası Nikomakhos, Makedonya Kralı III. Amyntas'ın sarayında hekim olarak görev yapıyordu. Aristoteles'in küçük yaşlardan itibaren bilim ve doğayla ilgilenmesinde ailesinin etkili olduğu düşünülmektedir.","Genç yaşta ailesini kaybetti. Yaklaşık 17 yaşındayken eğitimini sürdürmek amacıyla Atina'ya gitti ve dönemin en önemli düşünce merkezlerinden biri olan Platon'un Akademisi'ne katıldı.","Yaklaşık 20 yıl boyunca Platon'un öğrencisi ve çalışma arkadaşı olarak Akademi'de bulundu. Bu süreçte felsefe, matematik, siyaset ve doğa bilimleri üzerine kapsamlı çalışmalar yaptı.","Öğretmeni Platon'un düşüncelerinden önemli ölçüde etkilendi ancak zamanla bazı konularda farklı görüşler geliştirdi. Özellikle Platon'un idealar kuramını eleştirerek bilginin oluşumunda gözlem ve deneyimin önemini vurguladı.","MÖ 347 yılında Platon'un ölümünden sonra Atina'dan ayrıldı. Bir süre Anadolu'nun batısındaki Assos ve Midilli Adası'nda yaşadı. Bu dönemlerde özellikle deniz canlıları ve doğa üzerine araştırmalar gerçekleştirdi.","MÖ 343 veya 342 yıllarında Makedonya Kralı II. Filip tarafından oğlu Büyük İskender'in eğitmeni olarak görevlendirildi. Aristoteles, geleceğin hükümdarına felsefe, siyaset, edebiyat, bilim ve ahlak konularında eğitim verdi.","Büyük İskender'in eğitiminde önemli bir rol oynadı. Ancak Aristoteles'in öğretilerinin İskender'in sonraki bütün siyasi ve askerî kararlarını belirlediğini söylemek doğru değildir.","MÖ 335 yılında Atina'ya geri döndü ve kendi felsefe okulunu kurdu. Bu okul, yakınındaki Apollon Lykeios tapınağından dolayı Lykeion (Lyceum) olarak adlandırıldı.","Aristoteles'in okulunda felsefenin yanı sıra biyoloji, fizik, astronomi, matematik, siyaset, edebiyat ve mantık gibi birçok alan araştırılıyordu. Öğrencileriyle birlikte doğayı gözlemliyor, canlıları inceliyor ve farklı bilim dallarında bilgi topluyordu.Aristoteles ve öğrencilerinin yürüyerek tartışmalar yaptığına ilişkin gelenek nedeniyle okulun takipçileri Peripatetikler, yani gezinenler olarak anılmıştır.","Mantık alanında sistemli çalışmalar gerçekleştirdi. Özellikle kıyas adı verilen akıl yürütme yöntemini inceleyerek doğru sonuçlara ulaşmada öncüllerin ve mantıksal bağlantıların önemini ortaya koydu.","Bilimsel araştırmalarda gözlem yapmanın ve olayların nedenlerini araştırmanın önemini savundu. Canlıları inceleyerek hayvanların özelliklerini, davranışlarını ve gelişimlerini sınıflandırmaya çalıştı.","Fizik ve doğa felsefesi üzerine yaptığı çalışmalarda hareket, değişim, madde, zaman ve evrenin yapısı gibi konuları ele aldı. Bu konulardaki bazı görüşleri daha sonraki bilimsel araştırmalarla değiştirilmiş olsa da düşünceleri yüzyıllarca etkili oldu.","Metafizik alanında varlık, neden, madde, biçim ve değişim gibi temel kavramları araştırdı. Varlığın ne olduğunu ve evrendeki olayların hangi nedenlerle gerçekleştiğini açıklamaya çalıştı.","Etik anlayışında mutluluğu, insan yaşamının en önemli amaçlarından biri olarak değerlendirdi. Ona göre gerçek mutluluk yalnızca haz ve zenginlikle değil, erdemli davranışlar ve akıl doğrultusunda yaşamakla elde edilebilirdi.","Altın Orta olarak bilinen düşüncesinde erdemli davranışların çoğu zaman iki aşırı uç arasında bulunduğunu savundu. Örneğin cesaretin, korkaklık ile düşüncesizce atılganlık arasında bir denge olduğunu açıkladı.","Siyaset alanında devlet yönetimini, yönetim biçimlerini ve toplumların nasıl düzenlenmesi gerektiğini inceledi. İnsanların toplumsal yaşam içinde gelişebildiğini savunarak insanı siyasi bir varlık olarak tanımladı.","Edebiyat ve tiyatro üzerine yazdığı Poetika adlı eserinde özellikle tragedya türünü ele aldı. Hikâyelerin yapısını, karakterleri, olay örgüsünü ve sanatın insanlar üzerindeki etkisini inceledi.","Retorik adlı eserinde etkili ve ikna edici konuşmanın özelliklerini araştırdı. Konuşmacının güvenilirliği, dinleyicilerin duyguları ve kullanılan mantıklı kanıtlar üzerinde durdu.","Nikomakhos'a Etik adlı eseri, ahlak felsefesinin en önemli kaynaklarından biri kabul edilir. Bu eserinde mutluluk, dostluk, adalet, cesaret ve erdem gibi konuları ayrıntılı biçimde ele aldı.","Politika adlı eserinde devletin yapısını, vatandaşlığı, yönetim biçimlerini ve toplum düzenini değerlendirdi. Farklı yönetim sistemlerini karşılaştırarak iyi bir devletin nasıl olması gerektiğini araştırdı.","Metafizik adlı eserinde varlığın temel ilkelerini ve ilk nedenleri ele aldı. Bu çalışma, sonraki yüzyıllarda hem Batı hem de İslam dünyasındaki filozofları önemli ölçüde etkiledi.","Hayvanların Tarihi adlı eserinde çok sayıda hayvan türünü inceleyerek fiziksel özelliklerini, yaşam biçimlerini ve davranışlarını kaydetti. Bu çalışmaları nedeniyle biyoloji ve zooloji tarihinin öncü isimlerinden biri kabul edilir.","Aristoteles'in yaşamı boyunca yaklaşık 200 eser yazdığı aktarılır. Ancak bu eserlerin tamamı günümüze ulaşmamıştır. Bugün ona ait olduğu kabul edilen eserlerin önemli bir bölümü ders notları ve inceleme metinlerinden oluşmaktadır.","Düşünceleri yalnızca Antik Yunan dünyasında kalmadı. Orta Çağ boyunca Avrupa, Bizans ve İslam dünyasında geniş biçimde incelendi. İslam dünyasında Aristoteles'e büyük öğretmen anlamında Muallim-i Evvel denildi.","Farabi, İbn Sina ve İbn Rüşd gibi önemli düşünürler Aristoteles'in eserlerini inceleyerek onun felsefesini yorumladılar ve geliştirdiler. Özellikle İbn Rüşd'ün Aristoteles üzerine yazdığı yorumlar Avrupa düşünce tarihinde de etkili oldu.","Büyük İskender'in MÖ 323 yılında ölümünden sonra Atina'da Makedonya karşıtı düşünceler güç kazandı. Aristoteles de dinsizlik suçlamasıyla karşı karşıya kalabileceğini düşünerek şehirden ayrıldı.","MÖ 322 yılında, yaklaşık 62 yaşındayken Euboea Adası'ndaki Khalkis şehrinde hayatını kaybetti","Aristoteles; mantık, biyoloji, fizik, etik, siyaset, edebiyat ve metafizik alanlarında bıraktığı eserlerle insanlık düşünce tarihinin en etkili isimlerinden biri hâline geldi. Çalışmaları günümüzde de üniversitelerde ve bilimsel araştırmalarda incelenmeye devam etmektedir."]},
{name:"Immanuel Kant",category:"Felsefe",info:["22 Nisan 1724 tarihinde, o dönemde Prusya Krallığı sınırları içerisinde bulunan Königsberg şehrinde (günümüzde Rusya'nın Kaliningrad şehri) dünyaya geldi.","Babası Johann Georg Kant, saraçlık yaparak geçimini sağlıyordu. Annesi Anna Regina Reuter ise Kant'ın eğitiminde ve düşünsel gelişiminde önemli bir rol oynadı.","Kant, çocukluk yıllarından itibaren disiplinli ve düzenli bir eğitim aldı. Ailesinin dindar yaşam tarzı, onun ahlak ve din üzerine düşüncelerinin gelişmesinde etkili oldu.","1732 yılında Collegium Fridericianum adlı okula başladı. Burada Latince başta olmak üzere dönemin temel eğitim derslerini öğrendi.","1740 yılında Königsberg Üniversitesi'ne girdi. Üniversitede matematik, fizik, felsefe ve doğa bilimleri üzerine eğitim aldı.","1746 yılında babasının ölümünün ardından maddi zorluklar yaşadı. Üniversitedeki eğitimini tamamlamak yerine özel öğretmenlik yapmaya başladı.","Yaklaşık dokuz yıl boyunca farklı ailelerin yanında özel öğretmen olarak çalıştı. Bu dönemde hem geçimini sağladı hem de bilimsel ve felsefi araştırmalarını sürdürdü.","1755 yılında Königsberg Üniversitesi'ne geri döndü ve akademik çalışmalarına devam etti. Aynı yıl çeşitli bilimsel ve felsefi eserler yayımladı.","İlk dönem çalışmalarında özellikle doğa bilimleri, astronomi, fizik ve metafizik konularına ilgi gösterdi. Newton fiziğinden etkilenerek evrenin oluşumu ve işleyişi üzerine düşünceler geliştirdi.","1755 yılında yayımladığı Evrensel Doğa Tarihi ve Gökler Teorisi adlı eserinde Güneş Sistemi'nin bir gaz ve toz bulutunun zamanla yoğunlaşması sonucunda oluştuğunu ileri sürdü. Bu düşünce daha sonra Kant-Laplace Bulutsu Hipotezi olarak anılan teorinin tarihsel temellerinden biri oldu.","1760'lı yıllarda felsefe alanındaki araştırmalarını derinleştirdi. Özellikle insan bilgisinin sınırları, metafizik, ahlak ve mantık konularıyla ilgilenmeye başladı.","1770 yılında Königsberg Üniversitesi'nde mantık ve metafizik profesörlüğüne getirildi. Bu görev, onun akademik hayatındaki en önemli dönüm noktalarından biri oldu.","Kant, uzun yıllar boyunca Königsberg'den çok az ayrıldı ve yaşamının büyük bölümünü bu şehirde geçirdi. Düzenli günlük yaşamı ve dakikliğiyle tanındı.","1781 yılında en önemli eserlerinden biri olan Saf Aklın Eleştirisi'ni yayımladı. Bu eserinde insan aklının neleri bilebileceğini, bilginin nasıl oluştuğunu ve bilginin sınırlarının nerede başladığını araştırdı.","Saf Aklın Eleştirisi'nde bilginin yalnızca deneyimden veya yalnızca akıldan kaynaklanmadığını savundu. Ona göre insan zihni, deneyim yoluyla gelen bilgileri kendi temel algılama ve düşünme biçimleriyle düzenler.","Kant'ın felsefesinde zaman ve mekân, insanın dünyayı deneyimleme biçiminin temel koşullarıdır. İnsanlar dış dünyayı doğrudan olduğu gibi değil, kendi algılama ve anlama yapıları aracılığıyla tanırlar.","Kant, insanın deneyimleyebildiği dünyayı fenomenler dünyası olarak adlandırdı. Deneyimin ötesinde kalan ve kendinde şey olarak ifade ettiği gerçekliğin ise insan bilgisiyle bütünüyle kavranamayacağını savundu.","1785 yılında Ahlak Metafiziğinin Temellendirilmesi adlı eserini yayımladı. Bu çalışmasında ahlakın temelini, insanın akıl sahibi ve özgür bir varlık olması üzerinden açıkladı.","Kant'ın ahlak felsefesinin merkezinde kategorik imperatif adı verilen koşulsuz ahlak ilkesi bulunur. Bu ilkeye göre insan, davranışlarının herkes için geçerli evrensel bir kurala dönüşmesini isteyebileceği şekilde hareket etmelidir.","Ona göre bir davranışın ahlaki değeri yalnızca ortaya çıkardığı sonuçlara bağlı değildir. Kişinin doğru olanı, görev bilinciyle ve iyi niyetle yapması da büyük önem taşır.","1788 yılında Pratik Aklın Eleştirisi adlı eserini yayımladı. Bu kitabında ahlak, özgürlük, sorumluluk ve insan iradesi arasındaki ilişkiyi ayrıntılı biçimde inceledi.","1790 yılında Yargı Gücünün Eleştirisi adlı eserini yayımladı. Bu çalışmasında estetik, güzellik, sanat, doğadaki düzen ve canlıların amaçlı görünümü gibi konuları ele aldı.","1784 yılında yayımladığı Aydınlanma Nedir? Sorusuna Bir Cevap adlı makalesinde aydınlanmayı, insanın kendi aklını başkasının yönlendirmesine ihtiyaç duymadan kullanabilmesi olarak açıkladı.","Kant, insanların düşüncelerini özgürce ifade edebilmesini ve akıllarını kullanabilmesini savundu. Aydınlanmanın temelinde bağımsız düşünme ve sorgulama yeteneğinin bulunduğunu ileri sürdü.","1795 yılında Ebedî Barış Üzerine Felsefi Bir Deneme adlı eserini yayımladı. Bu eserinde devletler arasındaki savaşların önlenmesi, uluslararası hukuk ve kalıcı barışın kurulması üzerine düşünceler geliştirdi.","Kant, devletlerin birbirleriyle ilişkilerinde hukuka dayalı kuralların önemini vurguladı. Kalıcı barışın yalnızca savaşların sona ermesiyle değil, adil siyasi ve hukuki düzenlemelerle mümkün olabileceğini savundu.","Ahlak felsefesi, bilgi felsefesi, siyaset felsefesi, estetik ve din felsefesi alanlarında önemli çalışmalar yaptı. Bu alanlarda ortaya koyduğu düşünceler modern felsefenin gelişimini büyük ölçüde etkiledi.","Kant'ın felsefesi, kendisinden önceki akılcılık ve deneycilik geleneklerini bir araya getirerek eleştirel felsefe adı verilen yeni bir yaklaşımın gelişmesini sağladı.","Kendisinden sonra gelen Alman idealistleri, özellikle Hegel, Fichte ve Schelling gibi filozoflar Kant'ın düşüncelerinden önemli ölçüde etkilendi.","Kant'ın eserleri yalnızca felsefe alanında değil; hukuk, siyaset bilimi, psikoloji, eğitim ve sanat teorisi gibi birçok farklı alanda da etkili oldu.","Yaşamı boyunca evlenmedi ve çocuk sahibi olmadı. Düzenli çalışma alışkanlığı, dersleri ve akademik araştırmaları günlük yaşamının önemli bir bölümünü oluşturuyordu.","Kant, hayatının son yıllarında yaşlanmaya bağlı sağlık sorunları ve hafıza kaybı yaşamaya başladı. Akademik çalışmalarını giderek azaltmak zorunda kaldı.","12 Şubat 1804 tarihinde, doğduğu Königsberg şehrinde 79 yaşında hayatını kaybetti. Ölümünden sonra düşünceleri Avrupa'da ve dünyanın farklı bölgelerinde felsefe tartışmalarının temel konularından biri olmaya devam etti.","Immanuel Kant, özellikle insan bilgisinin sınırlarını açıklaması, evrensel ahlak ilkesi üzerine geliştirdiği düşünceleri ve özgür akıl anlayışıyla felsefe tarihinin en önemli filozoflarından biri kabul edilmektedir."]},

{name:"Orhan Gazi",category: "Osmanlı",info:["Orhan Gazi, yaklaşık 1281 yılında Söğüt veya çevresinde dünyaya geldi. Osmanlı Devleti'nin kurucusu Osman Gazi ile Malhun Hatun'un oğludur.","Çocukluk ve gençlik yıllarını Osmanlı Beyliği'nin kuruluş döneminde geçirdi. Babası Osman Gazi'nin yanında yetişerek devlet yönetimi, savaş taktikleri ve siyasi ilişkiler konusunda deneyim kazandı.","Osman Gazi'nin en büyük oğullarından biri olan Orhan Bey, genç yaşlardan itibaren beyliğin askerî faaliyetlerinde görev aldı.","Osman Gazi'nin 1324 yılı civarında yönetimden çekilmesinin ardından beyliğin başına geçti. Böylece Osmanlı Devleti'nin ikinci hükümdarı oldu.","Orhan Gazi'nin hükümdarlığının ilk yıllarında Osmanlı Beyliği'nin en önemli hedeflerinden biri Bizans'ın Anadolu'daki topraklarını ele geçirmek ve Marmara Bölgesi'nde güç kazanmaktı.","1326 yılında Bursa'yı kuşattı. Şehrin uzun süren kuşatmanın ardından Osmanlıların eline geçmesiyle Bursa, Osmanlı Devleti'nin önemli merkezlerinden biri hâline geldi.","Bursa'nın fethedilmesi Osmanlı tarihi açısından büyük önem taşıdı. Şehir, ekonomik ve siyasi açıdan gelişerek devletin başkentlerinden biri oldu.","Bursa'nın fethinden sonra şehirde camiler, medreseler, hanlar ve çeşitli kamu yapıları inşa ettirildi. Böylece Bursa, önemli bir ticaret ve kültür merkezi hâline gelmeye başladı.","1329 yılında Bizans İmparatoru III. Andronikos'un kuvvetlerine karşı Pelekanon Muharebesi'nde mücadele etti. Osmanlıların zaferi, Bizans'ın Anadolu'daki askerî gücünü zayıflattı.","1331 yılında İznik'i fethetti. İznik, Bizans döneminde önemli bir dinî ve siyasi merkezdi. Fetihten sonra şehirdeki bazı önemli yapılar Osmanlı döneminde farklı amaçlarla kullanılmaya başlandı.","İznik'in alınması Osmanlıların Anadolu'daki hâkimiyetini güçlendirdi. Şehir, Osmanlı eğitim ve kültür hayatının gelişmesinde önemli bir merkez oldu.","1337 yılında İzmit'i ele geçirdi. Böylece Osmanlı Beyliği, Marmara Denizi'nin güney ve doğu kıyılarında daha güçlü bir konuma ulaştı.","Orhan Gazi döneminde Karesi Beyliği'nin toprakları Osmanlı hâkimiyetine girdi. Bu gelişme Osmanlıların Anadolu'daki topraklarını genişletirken Rumeli'ye geçişlerini de kolaylaştırdı.","Karesi Beyliği'nin Osmanlılara katılmasıyla birlikte deneyimli denizciler ve askerî güçler Osmanlı hizmetine girdi. Bu durum Osmanlıların denizcilik faaliyetlerinin gelişmesine katkıda bulundu.","Orhan Gazi, Bizans İmparatorluğu'ndaki taht mücadelelerinden yararlanarak siyasi ilişkiler kurdu. Bu ilişkiler sayesinde Osmanlıların Balkanlar'a geçiş süreci hızlandı.","1346 yılında Bizans İmparatoru VI. Ioannes Kantakuzenos'un kızı Theodora ile evlendi. Bu evlilik, Osmanlılar ile Bizans arasındaki siyasi ilişkilerin önemli bir parçasıydı.","1352 yılında Osmanlı kuvvetleri, Bizans'taki iç mücadeleler sırasında Gelibolu Yarımadası yakınlarında bulunan Çimpe Kalesi'ne yerleşti. Bu gelişme Osmanlıların Rumeli'deki kalıcı ilerleyişi açısından önemli bir başlangıç oldu.","1354 yılında meydana gelen büyük depremden sonra Gelibolu ve çevresindeki Bizans savunması zayıfladı. Osmanlı kuvvetleri bu durumdan yararlanarak bölgede daha güçlü bir hâkimiyet kurdu.","Rumeli'ye geçiş, Osmanlı tarihinin en önemli gelişmelerinden biri oldu. Böylece Osmanlı Beyliği yalnızca Anadolu'da değil, Avrupa topraklarında da genişlemeye başladı.","Orhan Gazi döneminde Osmanlı ordusunun teşkilatlanmasına önem verildi. Düzenli askerî birliklerin geliştirilmesi ve askerî yönetimin güçlendirilmesi devletin büyümesine katkı sağladı.","Yaya ve müsellem adı verilen askerî birlikler bu dönemde oluşturuldu. Yaya birlikleri piyadelerden, müsellem birlikleri ise atlı askerlerden meydana geliyordu.","Orhan Gazi döneminde Osmanlı Devleti'nin yönetim teşkilatı gelişti. Vezirlik makamı güçlendi ve devlet işlerinin daha düzenli yürütülmesi için çeşitli idari düzenlemeler yapıldı.","İlk Osmanlı medresesi 1331 yılında İznik'te kuruldu. Bu medresenin ilk müderrisi, dönemin önemli din ve düşünce insanlarından Davud-ı Kayseri oldu.","Osmanlı Devleti'nde eğitim faaliyetlerinin gelişmesine önem verdi. Medreseler aracılığıyla dinî ilimlerin yanı sıra farklı bilgi alanlarında eğitim verilmesinin temelleri güçlendirildi.","Orhan Gazi döneminde Osmanlı adına ilk gümüş akçelerin basıldığı kabul edilir. Para basılması, beyliğin ekonomik ve siyasi açıdan bağımsızlığını göstermesi bakımından önemliydi.","Ticaretin gelişmesine önem verdi. Bursa, İznik ve İzmit gibi şehirlerin Osmanlı hâkimiyetine girmesiyle ticaret yolları üzerindeki kontrol güçlendi.","Orhan Gazi, fethettiği bölgelerde yalnızca askerî hâkimiyet kurmakla kalmadı; cami, medrese, imaret ve diğer sosyal yapıların kurulmasını da destekledi.","Osmanlıların Bizans ile ilişkileri dönem boyunca hem savaş hem de diplomasi yoluyla sürdü. Orhan Gazi, gerektiğinde anlaşmalar yaparak devletin çıkarlarını korumaya çalıştı.","Orhan Gazi'nin hükümdarlığı boyunca Osmanlı Beyliği küçük bir sınır beyliğinden, Anadolu ve Rumeli'de etkili olan güçlü bir siyasi yapıya dönüştü.","Orhan Gazi'nin oğulları arasında I. Murad, Süleyman Paşa ve Halil bulunuyordu. Özellikle Süleyman Paşa, Osmanlıların Rumeli'deki ilk ilerleyişinde önemli görevler üstlendi.","Orhan Gazi'nin oğlu Süleyman Paşa, Rumeli'deki fetih hareketlerinin öncülerinden biri oldu. Ancak 1357 yılında hayatını kaybetmesi, Osmanlıların Avrupa'daki ilerleyişi açısından önemli bir kayıp olarak değerlendirildi.","Orhan Gazi'nin ölüm tarihi genellikle 1362 yılı olarak kabul edilir. Bursa'da hayatını kaybettiği ve Osmanlı hanedanının aile türbesinde defnedildiği bilinmektedir.","Orhan Gazi, yaklaşık 38 yıl süren hükümdarlığı boyunca Osmanlı Beyliği'nin topraklarını genişletti, devlet teşkilatını güçlendirdi ve Rumeli'ye geçişin temellerini attı.","Osmanlı Devleti'nin kalıcı bir devlet yapısına dönüşmesinde büyük rol oynadı. Kurduğu idari ve askerî düzen, kendisinden sonra hükümdar olan oğlu I. Murad dönemindeki genişlemenin temelini oluşturdu.","Orhan Gazi, Osmanlı tarihindeki önemli hükümdarlardan biri olarak kabul edilir. Bursa, İznik ve İzmit'in fethi, ilk Osmanlı kurumlarının gelişmesi ve Rumeli'ye geçiş sürecinin başlaması onun döneminin en önemli başarıları arasında yer alır."]},
{name:"I. Murad",category: "Osmanlı",info:["I. Murad, 1326 yılında Bursa'da dünyaya geldi. Babası Osmanlı Devleti'nin ikinci hükümdarı Orhan Gazi, annesi ise Nilüfer Hatun'dur.","Çocukluk ve gençlik yıllarını Osmanlı Beyliği'nin güçlenme döneminde geçirdi. Babasının yanında yetişerek devlet yönetimi, askerlik ve siyasi ilişkiler konusunda deneyim kazandı.","Genç yaşlarından itibaren devlet işlerinde görev almaya başladı. Özellikle Anadolu'daki şehirlerin yönetimi ve askerî faaliyetlerde tecrübe kazandı.","Babası Orhan Gazi'nin 1362 yılında ölümünün ardından Osmanlı tahtına çıktı. Böylece Osmanlı Devleti'nin üçüncü hükümdarı oldu.","Tahta çıktığı dönemde Osmanlı Devleti hem Anadolu'da hem de Rumeli'de genişleme faaliyetlerini sürdürüyordu. I. Murad, özellikle Balkanlar'daki fetihlere ağırlık verdi.","Hükümdarlığının ilk döneminde Anadolu'daki bazı beyliklerin Osmanlı hâkimiyetini tanımasını sağladı. Böylece devletin Anadolu'daki siyasi gücünü korumaya çalıştı.","1361 yılında Edirne'nin Osmanlı kuvvetleri tarafından fethedilmesi, hükümdarlığının en önemli gelişmelerinden biri oldu. Edirne, daha sonra Osmanlı Devleti'nin önemli merkezlerinden ve başkentlerinden biri hâline geldi.","Edirne'nin alınması Osmanlıların Balkanlar'daki ilerleyişini kolaylaştırdı. Şehir, Avrupa yönündeki askerî hareketler için önemli bir üs hâline geldi.","Edirne'nin fethinden sonra Balkan devletleri Osmanlıların ilerleyişini durdurmak amacıyla ittifaklar kurmaya başladı. Bu durum bölgede Osmanlılar ile Balkan güçleri arasında mücadelelerin artmasına neden oldu.","1364 yılında Sırpsındığı Savaşı olarak bilinen savaşta Osmanlı kuvvetleri, Balkanlardan gelen Haçlı ordusuna karşı önemli bir zafer kazandı. Bu zafer Osmanlıların Balkanlar'daki ilerleyişini güçlendirdi.","1371 yılında Çirmen Savaşı'nda Osmanlı kuvvetleri Sırp güçlerini mağlup etti. Bu gelişme Osmanlıların Makedonya ve çevresindeki etkisini artırdı.","I. Murad döneminde Osmanlıların Balkanlar'daki hâkimiyeti genişledi. Bulgar, Sırp ve diğer Balkan siyasi güçleriyle mücadeleler ve siyasi anlaşmalar gerçekleştirildi.","Osmanlı Devleti'nin Anadolu'daki siyasi gücünü de artırmaya çalıştı. Germiyanoğulları ve Hamitoğulları gibi beyliklerle çeşitli siyasi ilişkiler kuruldu.","Germiyanoğulları Beyliği'nden bazı topraklar çeyiz yoluyla Osmanlı hâkimiyetine geçti. Hamitoğulları Beyliği'nden ise bazı bölgeler satın alınarak Osmanlı topraklarına katıldı.","I. Murad döneminde Osmanlı Devleti'nin yönetim teşkilatı gelişti. Devlet işlerinin daha düzenli yürütülmesi için vezirlik ve diğer yönetim makamlarının önemi arttı.","Kapıkulu askerî teşkilatının temelleri bu dönemde atıldı. Padişaha bağlı merkezî askerî birliklerin oluşturulması, Osmanlı ordusunun güçlenmesinde önemli rol oynadı.","Yeniçeri Ocağı'nın kuruluşu geleneksel olarak I. Murad dönemine tarihlendirilir. Bu ocak, Osmanlı Devleti'nin merkez ordusunun en önemli askerî birliklerinden biri hâline gelecekti.","Devşirme sisteminin ilk uygulamaları da genellikle I. Murad dönemiyle ilişkilendirilir. Bu sistem, ilerleyen dönemlerde Osmanlı Devleti'nin askerî ve idari kadrolarının yetiştirilmesinde önemli bir rol oynadı.","I. Murad döneminde Osmanlı ordusunun askerî düzeni geliştirildi. Piyade ve süvari birliklerinin yanı sıra merkezî ordu teşkilatının güçlendirilmesine önem verildi.","Kazaskerlik makamının oluşturulması ve devlet yönetiminde ilmiye sınıfının güçlenmesi de bu dönemin önemli gelişmeleri arasında gösterilir. Kazaskerler askerî ve adli konularda önemli görevler üstleniyordu.","I. Murad, fethedilen bölgelerde Osmanlı yönetimini kalıcı hâle getirmek amacıyla idari düzenlemeler yaptı. Rumeli'de yeni yönetim merkezleri oluşturuldu ve bölgenin idaresi için görevliler atandı.","Osmanlı Devleti'nin Balkanlar'da kalıcı olabilmesi için Anadolu'dan bazı Türk topluluklarının yeni fethedilen bölgelere yerleştirilmesini destekledi. Bu uygulama iskân politikası olarak bilinir.","1385 yılında Sofya'nın Osmanlı hâkimiyetine girmesi, Balkanlar'daki ilerleyiş açısından önemli bir gelişme oldu. Böylece Osmanlılar Balkanların iç kesimlerinde daha güçlü bir konuma ulaştı.","1386 yılında Sırp kuvvetleriyle yapılan Ploşnik Muharebesi'nde Osmanlı ordusu zor durumda kaldı. Bu gelişme Balkan devletlerinin Osmanlılara karşı daha büyük bir ittifak oluşturma çabalarını hızlandırdı.","1389 yılında Osmanlı ordusu ile Sırp öncülüğündeki Balkan kuvvetleri arasında I. Kosova Savaşı gerçekleşti. Savaş, Osmanlıların Balkanlar'daki hâkimiyetini güçlendiren önemli bir zaferle sonuçlandı.","I. Kosova Savaşı'nda Osmanlı ordusunun karşısında Sırp kuvvetlerinin yanı sıra farklı Balkan topluluklarından askerler de bulunuyordu. Savaş, Orta Çağ Balkan tarihinin önemli askerî mücadelelerinden biri kabul edilir.","Savaşın ardından I. Murad, savaş alanını gezerken Miloş Obiliç adıyla bilinen bir Sırp savaşçısı tarafından öldürüldü. Ölümü, Osmanlı tarihinde savaş meydanında hayatını kaybeden ilk padişah olarak anılmasına neden oldu.","I. Murad'ın ölüm tarihi 1389 yılıdır. Ölümünden sonra yerine oğlu I. Bayezid geçti ve Osmanlı tahtına çıktı.","I. Murad, Hüdavendigâr unvanıyla da tanınır. Bu unvan hükümdarlığı döneminde kullandığı önemli unvanlardan biridir.","Bursa'da kendisi adına yaptırılan yapılar arasında Hüdavendigâr Camii ve Külliyesi önemli bir yere sahiptir. Bu yapı, Osmanlı mimarisinin erken dönem örneklerinden biridir.","I. Murad döneminde Osmanlı Devleti küçük bir beylikten, Anadolu ve Balkanlar'da geniş topraklara sahip güçlü bir devlete dönüşme yolunda önemli ilerlemeler kaydetti.","Edirne'nin fethi, Balkanlarda kazanılan savaşlar, askerî teşkilatın geliştirilmesi ve merkezî yönetimin güçlendirilmesi onun hükümdarlığının en önemli başarıları arasında yer alır.","I. Murad, Osmanlı Devleti'nin Balkanlar'da kalıcı bir güç hâline gelmesinde büyük rol oynadı. Kendisi tarafından atılan askerî ve idari temeller, sonraki Osmanlı hükümdarlarının fetihlerini kolaylaştırdı."]},
{name:"Yıldırım Bayezid",category:"Osmanlı",info:["Yıldırım Bayezid, 1360 yılında dünyaya geldi. Babası Osmanlı Devleti'nin üçüncü hükümdarı I. Murad, annesi ise Gülçiçek Hatun'dur.","Çocukluk ve gençlik yıllarını Osmanlı Devleti'nin Balkanlar'da genişlediği bir dönemde geçirdi. Babasının yanında yetişerek devlet yönetimi, askerlik ve siyasi ilişkiler konusunda deneyim kazandı.","Genç yaşlarından itibaren devlet işlerinde görev almaya başladı. Kütahya ve çevresinin yönetimiyle görevlendirilerek Anadolu'daki siyasi gelişmeleri yakından tanıma fırsatı buldu.","Hızlı karar alması ve askerî seferlerde gösterdiği sürat nedeniyle Yıldırım lakabıyla tanındı. Bu lakap, özellikle ordusunu kısa sürede farklı bölgelere ulaştırabilmesiyle ilişkilendirilir.","1389 yılında babası I. Murad'ın I. Kosova Savaşı sırasında hayatını kaybetmesinin ardından Osmanlı tahtına çıktı. Böylece Osmanlı Devleti'nin dördüncü hükümdarı oldu.","Tahta çıktığı dönemde Osmanlı Devleti hem Anadolu'da hem de Balkanlar'da güçlü bir konumdaydı. Yıldırım Bayezid, bu topraklardaki Osmanlı hâkimiyetini genişletmek ve merkezî yönetimi güçlendirmek istedi.","Hükümdarlığının ilk döneminde Anadolu'daki Türk beylikleri üzerinde hâkimiyet kurmaya yöneldi. Germiyanoğulları, Aydınoğulları, Saruhanoğulları, Menteşeoğulları ve Hamitoğulları gibi beyliklerin topraklarının önemli bir bölümü Osmanlı hâkimiyetine girdi.","Anadolu'daki fetihler sayesinde Osmanlı Devleti'nin toprak bütünlüğünü genişletti. Ancak bazı beyliklerin Osmanlı yönetimine katılması, ilerleyen yıllarda Timur ile yaşanacak siyasi anlaşmazlıkların nedenlerinden biri oldu.","Balkanlar'da Osmanlı hâkimiyetini güçlendirmek amacıyla Sırp, Bulgar ve diğer bölgesel güçlerle mücadele etti. Bazı Balkan hükümdarları Osmanlı üstünlüğünü kabul ederek vergi ödemeyi ve asker göndermeyi kabul etti.","1391 yılında İstanbul'u kuşatma girişiminde bulundu. Bizans İmparatorluğu'nun başkenti olan İstanbul, Osmanlıların Avrupa ve Anadolu toprakları arasındaki bağlantısını güçlendirmek açısından büyük önem taşıyordu.","İstanbul'u ele geçirmek amacıyla farklı dönemlerde kuşatmalar düzenledi. Ancak şehrin güçlü surları, Bizans'ın savunması ve Avrupa'dan gelebilecek yardımlar nedeniyle İstanbul'u fethedemedi.","İstanbul kuşatmasını güçlendirmek amacıyla Anadolu Hisarı'nı yaptırdı. Güzelce Hisar olarak da bilinen bu yapı, Boğaz'ın Anadolu yakasında inşa edilerek İstanbul'a ulaşan deniz trafiğinin kontrol edilmesini kolaylaştırdı.","1394 yılında Balkanlar'daki Osmanlı ilerleyişine karşı Macar Kralı Sigismund öncülüğünde büyük bir Haçlı ittifakı oluşturuldu. Avrupa'nın farklı bölgelerinden gelen askerler Osmanlılara karşı sefere çıktı.","25 Eylül 1396 tarihinde Niğbolu Savaşı gerçekleşti. Yıldırım Bayezid komutasındaki Osmanlı ordusu, Macar Kralı Sigismund'un öncülük ettiği Haçlı ordusunu ağır bir yenilgiye uğrattı.","Niğbolu Zaferi, Osmanlı Devleti'nin Avrupa'daki saygınlığını ve askerî gücünü artırdı. Bu zaferden sonra Yıldırım Bayezid, İslam dünyasında da önemli bir hükümdar olarak tanındı.","Niğbolu Savaşı'ndan sonra Balkanlar'daki Osmanlı hâkimiyeti daha da güçlendi. Osmanlıların Avrupa'daki ilerleyişini durdurmak isteyen devletler için büyük bir darbe oldu.","1397 yılında Karamanoğulları Beyliği üzerine sefer düzenledi. Konya ve çevresinde Osmanlı hâkimiyetini güçlendirerek Anadolu'daki siyasi birliği sağlamaya çalıştı.","1398 yılında Kadı Burhaneddin Devleti'nin topraklarının önemli bir bölümü Osmanlı hâkimiyetine girdi. Böylece Osmanlı Devleti'nin Anadolu'nun doğusuna doğru etkisi genişledi.","1399 yılında Memlük Devleti'nin kontrolündeki bazı bölgelere yönelik askerî faaliyetlerde bulundu. Bu gelişmeler Osmanlılar ile Memlükler arasındaki siyasi ilişkilerin zaman zaman gerginleşmesine neden oldu.","Yıldırım Bayezid döneminde Osmanlı Devleti'nin merkezî yönetimi güçlendirildi. Anadolu'daki beyliklerin doğrudan Osmanlı yönetimine alınmasıyla padişahın siyasi otoritesi genişledi.","Ordu teşkilatının geliştirilmesine önem verdi. Kapıkulu askerleri ve tımarlı sipahiler gibi askerî birlikler, Osmanlı ordusunun farklı bölgelerdeki savaşlarda etkili olmasını sağladı.","Devletin ekonomik gücünü artırmak amacıyla ticaret yollarının ve önemli şehirlerin kontrolünü sağlamaya çalıştı. Bursa, Edirne ve diğer merkezler Osmanlı yönetiminin önemli şehirleri olarak gelişmeye devam etti.","Yıldırım Bayezid döneminde Osmanlı mimarisi ve şehircilik faaliyetleri de gelişti. Bursa'da Ulu Cami'nin inşası bu dönemin en önemli mimari çalışmalarından biridir.","Bursa Ulu Cami'nin yapımına 1396 yılında Niğbolu Zaferi sonrasında başlandığı kabul edilir. Cami, yirmi kubbeli mimarisiyle Osmanlı tarihinin en önemli dinî yapılarından biri hâline geldi.","Yıldırım Bayezid, Anadolu'daki siyasi birliği sağlamak amacıyla birçok beyliği Osmanlı yönetimine kattı. Ancak bu politika, bazı Anadolu beylerinin eski topraklarını geri almak istemesine neden oldu.","Doğuda güçlenen Timur Devleti ile Osmanlılar arasında siyasi gerilimler yaşanmaya başladı. Timur'un Anadolu'daki beyliklerle ilişkileri ve Yıldırım Bayezid'in genişleme politikası iki hükümdar arasındaki anlaşmazlığı artırdı.","Timur ile Yıldırım Bayezid arasında karşılıklı mektuplar gönderildi. Mektuplardaki sert ifadeler ve siyasi anlaşmazlıklar, iki büyük hükümdar arasındaki gerilimin daha da büyümesine yol açtı.","1402 yılında Timur'un ordusu Anadolu'ya ilerledi. Yıldırım Bayezid de Osmanlı ordusuyla Timur'un kuvvetlerini karşılamak üzere harekete geçti.","28 Temmuz 1402 tarihinde Ankara Savaşı gerçekleşti. Savaşta Timur'un ordusu, Yıldırım Bayezid komutasındaki Osmanlı kuvvetlerini mağlup etti.","Ankara Savaşı'nda Osmanlı ordusunun yenilmesinde Anadolu beyliklerinden gelen bazı askerlerin Timur'un tarafına geçmesi, ordudaki yorgunluk ve Timur'un askerî taktikleri etkili oldu.","Ankara Savaşı'nın ardından Yıldırım Bayezid esir düştü. Bu olay Osmanlı Devleti tarihinde büyük bir siyasi krize neden oldu.","Yıldırım Bayezid'in esir düşmesiyle Osmanlı Devleti'nde oğulları arasında taht mücadeleleri başladı. Süleyman Çelebi, İsa Çelebi, Musa Çelebi ve Mehmet Çelebi arasında yaşanan bu dönem Fetret Devri olarak adlandırılır.","Ankara Savaşı sonrasında Anadolu'da daha önce Osmanlı yönetimine katılmış bazı beylikler yeniden bağımsızlık kazandı. Böylece Yıldırım Bayezid döneminde büyük ölçüde sağlanan Anadolu siyasi birliği bozuldu.","Yıldırım Bayezid, esaret altında bulunduğu dönemde Timur'un yanında kaldı. 1403 yılında Akşehir'de hayatını kaybetti.","Ölümünün ardından Osmanlı Devleti'nde taht mücadeleleri devam etti. Bu mücadeleler ancak oğlu Çelebi Mehmet'in 1413 yılında diğer kardeşlerini yenerek tek hükümdar olmasıyla sona erdi.","Yıldırım Bayezid, yaklaşık on üç yıl süren hükümdarlığı boyunca Osmanlı Devleti'nin hem Anadolu'da hem de Balkanlar'da genişlemesini sağladı.","Niğbolu Zaferi, İstanbul kuşatmaları, Anadolu beyliklerinin Osmanlı hâkimiyetine alınması ve Bursa Ulu Cami gibi önemli eserler onun döneminin dikkat çeken gelişmeleri arasındadır.","Ankara Savaşı'ndaki yenilgisi Osmanlı Devleti'ni büyük bir krize sürüklemiş olsa da daha önce gerçekleştirdiği askerî ve siyasi çalışmalar Osmanlı tarihinin gelişiminde önemli bir yer tutmuştur.","Yıldırım Bayezid, hızlı askerî hareketleri, Anadolu'da siyasi birliği sağlama çabaları ve Balkanlar'daki fetihleri nedeniyle Osmanlı tarihinin en dikkat çekici hükümdarlarından biri olarak kabul edilir."]},
{name:"Çelebi Mehmet",category:"Osmanlı",info:["Çelebi Mehmet, 1389 yılında dünyaya geldi. Babası Osmanlı Devleti'nin dördüncü hükümdarı Yıldırım Bayezid, annesi ise Devlet Hatun'dur.","Çocukluk ve gençlik yıllarını Osmanlı Devleti'nin genişleme döneminde geçirdi. Babasının yanında yetişerek devlet yönetimi, askerlik ve siyasi ilişkiler konusunda deneyim kazandı.","Genç yaşlarda Amasya çevresinin yönetimiyle görevlendirildi. Bu görev sayesinde Anadolu'daki siyasi gelişmeleri yakından tanıma fırsatı buldu.","1402 yılında Osmanlı Devleti için büyük bir dönüm noktası yaşandı. Yıldırım Bayezid ile Timur arasında gerçekleşen Ankara Savaşı'nda Osmanlı ordusu yenildi ve Yıldırım Bayezid esir düştü.","Ankara Savaşı'nın ardından Osmanlı Devleti'nde taht mücadeleleri başladı. Yıldırım Bayezid'in oğulları arasında yaşanan bu mücadele dönemi, Osmanlı tarihinde Fetret Devri olarak adlandırılır.","Fetret Devri sırasında Osmanlı toprakları üzerinde farklı şehzadeler hâkimiyet kurmaya çalıştı. Süleyman Çelebi, İsa Çelebi, Musa Çelebi ve Mehmet Çelebi arasında uzun süren mücadeleler yaşandı.","Mehmet Çelebi, Amasya merkezli olarak güç kazandı. Anadolu'daki bazı beyliklerin ve Türkmen gruplarının desteğini alarak kardeşlerine karşı mücadele etmeye başladı.","1403 yılında babası Yıldırım Bayezid'in ölümünden sonra taht mücadelesi daha da önem kazandı. Mehmet Çelebi, Osmanlı Devleti'nin yeniden birleştirilmesi için siyasi ve askerî faaliyetlerini sürdürdü.","İlk olarak kardeşi İsa Çelebi ile mücadele etti. Bursa ve çevresinde yaşanan çatışmaların ardından İsa Çelebi'nin gücü zayıfladı ve Mehmet Çelebi Anadolu'daki hâkimiyetini genişletti.","Daha sonra Rumeli'de hâkimiyet kuran kardeşi Süleyman Çelebi ile mücadele etti. Bu süreçte farklı dönemlerde çeşitli siyasi ittifaklar kurarak güç kazanmaya çalıştı.","1411 yılında Musa Çelebi, Süleyman Çelebi'yi yenerek Rumeli'de hâkimiyet kurdu. Ancak kısa süre sonra Mehmet Çelebi ile Musa Çelebi arasında yeni bir taht mücadelesi başladı.","1413 yılında gerçekleşen mücadeleler sonucunda Mehmet Çelebi, Musa Çelebi'yi mağlup etti. Böylece Osmanlı Devleti üzerindeki taht mücadelesini kazanarak devletin tek hükümdarı oldu.","Fetret Devri'ni sona erdirerek Osmanlı Devleti'nin siyasi birliğini yeniden sağladı. Bu nedenle tarihçiler tarafından Osmanlı Devleti'nin ikinci kurucusu olarak da anılır.","Tahta çıktıktan sonra öncelikli hedefi, Ankara Savaşı'ndan sonra zayıflayan Osmanlı yönetimini yeniden güçlendirmek ve Anadolu ile Rumeli arasındaki siyasi birliği korumaktı.","Anadolu'daki eski Osmanlı topraklarını yeniden kontrol altına almaya çalıştı. Ancak Ankara Savaşı sonrasında güçlenen Anadolu beylikleriyle mücadele etmek zorunda kaldı.","1414 yılında Aydın ve çevresinde Osmanlı hâkimiyetini yeniden güçlendirmek için harekete geçti. Bu süreçte Aydınoğulları Beyliği'nin topraklarının önemli bir bölümü Osmanlı kontrolüne girdi.","Saruhan, Menteşe ve diğer Anadolu beylikleriyle ilişkilerini yeniden düzenledi. Bazı bölgelerde askerî mücadeleler yürütürken bazı yerlerde siyasi anlaşmalardan yararlandı.","1416 yılında Venedik Cumhuriyeti ile Osmanlı donanması arasında deniz savaşları yaşandı. Gelibolu yakınlarında gerçekleşen mücadelede Osmanlı donanması ağır kayıplar verdi.","1416 yılında Şeyh Bedreddin İsyanı olarak bilinen önemli bir ayaklanma meydana geldi. Şeyh Bedreddin'in düşünceleri ve çevresinde toplanan gruplar Osmanlı yönetimine karşı hareket etti.","Şeyh Bedreddin'in hareketi bastırıldı. Kendisi yakalanarak yargılandı ve 1420 yılında Serez'de idam edildi. Bu olay, Çelebi Mehmet döneminin önemli siyasi gelişmelerinden biri oldu.","Aynı dönemde Börklüce Mustafa ve Torlak Kemal'in öncülük ettiği ayaklanmalar da ortaya çıktı. Osmanlı yönetimi bu hareketleri askerî güç kullanarak bastırdı.","Çelebi Mehmet, devletin merkezî otoritesini yeniden güçlendirmek için askerî ve idari düzenlemelere önem verdi. Fetret Devri'nde bozulan yönetim yapısını onarmaya çalıştı.","Rumeli'deki Osmanlı hâkimiyetini korumak için Balkan devletleriyle diplomatik ilişkiler yürüttü. Özellikle Sırp Despotluğu ve Bizans İmparatorluğu ile ilişkilerinde dikkatli bir siyaset izledi.","Bizans İmparatorluğu ile ilişkilerinde zaman zaman anlaşma yoluna gitti. Bu sayede devletin yeniden toparlanmasına öncelik verebildi.","Çelebi Mehmet döneminde Bursa yeniden önemli bir siyasi ve ekonomik merkez hâline geldi. Şehirdeki ticaretin ve devlet kurumlarının gelişmesine önem verildi.","Dinî ve sosyal yapılara destek verdi. Bursa'da yaptırdığı Yeşil Külliye, cami, medrese, türbe ve diğer yapılarıyla Osmanlı mimarisinin önemli eserlerinden biri hâline geldi.","Bursa'daki Yeşil Camii ve Yeşil Türbe, onun döneminin en tanınmış mimari eserleri arasında yer alır. Özellikle çini süslemeleri ve mimari özellikleriyle dikkat çeker.","Çelebi Mehmet, Osmanlı Devleti'nin yalnızca askerî açıdan değil, ekonomik ve sosyal açıdan da yeniden güçlenmesini amaçladı. Ticaret yollarının güvenliği ve şehirlerin gelişmesi için çalışmalar yürütüldü.","1421 yılında Edirne'de hayatını kaybetti. Ölümünden sonra yerine oğlu II. Murad geçti.","Çelebi Mehmet, yaklaşık sekiz yıl boyunca Osmanlı Devleti'nin tek hükümdarı olarak görev yaptı. Ancak Fetret Devri'ndeki mücadeleleri de hesaba katıldığında Osmanlı siyasetinde çok daha uzun süre etkili oldu.","Osmanlı Devleti'nin Ankara Savaşı sonrasında parçalanma tehlikesi yaşadığı bir dönemde mücadele ederek siyasi birliği yeniden kurdu.","Çelebi Mehmet, Fetret Devri'ni sona erdirmesi, Anadolu'daki Osmanlı hâkimiyetini yeniden sağlaması ve merkezî yönetimi güçlendirmesi nedeniyle Osmanlı tarihinin en önemli hükümdarlarından biri kabul edilir.","Tarih boyunca Osmanlı Devleti'nin dağılmasını önleyen ve devleti yeniden ayağa kaldıran hükümdar olarak anılmıştır. Bu nedenle Osmanlı tarihindeki yeri oldukça önemlidir."]},
{name:"II. Murad",category:"Osmanlı",info:["II. Murad, 1404 yılında Amasya'da doğdu. Babası Osmanlı padişahı I. Mehmed, annesi ise Emine Hatun'dur.","Çocukluk ve gençlik yıllarını Amasya'da geçirdi. Şehzadeliği sırasında devlet yönetimi ve askerlik konusunda eğitim aldı.","Babası I. Mehmed'in 1421 yılında vefat etmesinin ardından Osmanlı tahtına çıktı.","Tahta çıktığında Osmanlı Devleti hem Anadolu'da hem de Balkanlar'da çeşitli siyasi sorunlarla karşı karşıyaydı.","Tahta çıkışının ardından amcası Mustafa Çelebi'nin taht iddiasıyla mücadele etti. Bu mücadeleyi kazanarak yönetimini güçlendirdi.","Bizans İmparatorluğu, Osmanlı Devleti'ndeki taht mücadelelerinden yararlanarak bazı şehzadeleri destekledi. II. Murad bu müdahalelere karşı mücadele etti.","1422 yılında İstanbul'u kuşattı. Ancak kuşatma sırasında yaşanan gelişmeler ve Anadolu'daki sorunlar nedeniyle şehri alamadı.","Anadolu'da Osmanlı hâkimiyetini güçlendirmek için Aydın, Menteşe, Germiyan ve diğer beyliklerle ilgili siyasi ve askerî faaliyetlerde bulundu.","1425 yılında İzmir çevresindeki Aydınoğulları hâkimiyetine son verilmesinde etkili oldu.","Balkanlar'da Osmanlı hâkimiyetini genişletmek amacıyla Sırp Despotluğu ve Macar Krallığı ile mücadele etti.","1430 yılında Selanik'i Venediklilerden aldı. Böylece Osmanlı Devleti'nin Ege ve Balkanlar'daki konumu güçlendi.","1440 yılında Belgrad'ı kuşattı ancak kaleyi ele geçiremedi. Bu başarısızlık, Balkanlar'daki Osmanlı ilerleyişini bir süre yavaşlattı.","1443 yılında Macar ve müttefik kuvvetlerinin Balkanlar'daki saldırıları sonucunda Osmanlı ordusu bazı bölgelerde geri çekilmek zorunda kaldı.","1444 yılında Macaristan ile Edirne-Segedin Antlaşması'nı imzaladı. Bu antlaşmayla Balkanlar'da geçici bir barış ortamı oluşturuldu.","1444 yılında tahtı oğlu II. Mehmed'e bıraktı. Ancak genç padişahın deneyimsizliği ve devlet adamlarının isteği üzerine yeniden yönetimde etkili oldu.","1444 yılında Haçlı ordusunun Osmanlı topraklarına ilerlemesi üzerine II. Murad yeniden ordunun başına geçti.","10 Kasım 1444 tarihinde Varna Savaşı'nda Haçlı ordusunu mağlup etti. Bu zafer, Osmanlı Devleti'nin Balkanlar'daki varlığını koruması açısından önemliydi.","1446 yılında yaşanan Buçuktepe Olayı'nın ardından II. Murad yeniden tahta çıktı. Oğlu II. Mehmed ise Manisa'ya gönderildi.","1448 yılında yapılan II. Kosova Savaşı'nda Macar komutan Janos Hunyadi'nin ordusunu mağlup etti. Bu zafer, Haçlıların Balkanlar'daki Osmanlı hâkimiyetini sona erdirme girişimlerini büyük ölçüde engelledi.","II. Kosova Zaferi'nden sonra Osmanlı Devleti'nin Balkanlar'daki hâkimiyeti daha da sağlamlaştı.","II. Murad döneminde Osmanlı Devleti'nin askerî teşkilatı, yönetim sistemi ve kültürel hayatı gelişmeye devam etti.","Sanata, edebiyata ve bilime önem verdi. Döneminde Türkçe eserlerin yazılması ve edebî faaliyetlerin gelişmesi desteklendi.","Kendisi de şiirle ilgilendi. Şiirlerinde Muradî mahlasını kullandığı kabul edilir.","II. Murad, 3 Şubat 1451 tarihinde Edirne'de hayatını kaybetti.","Ölümünden sonra oğlu II. Mehmed yeniden Osmanlı tahtına çıktı ve daha sonra İstanbul'u fethederek Fatih unvanını kazandı.","II. Murad, özellikle Varna ve II. Kosova zaferleriyle Osmanlı Devleti'nin Balkanlar'daki gücünü koruyan ve güçlendiren önemli padişahlardan biri olarak tarihe geçti."]},

{name:"II. Bayezid",category:"Osmanlı",info:["II. Bayezid, 1447 veya 1448 yılında Amasya'da doğdu. Babası Osmanlı padişahı II. Mehmed, annesi ise Gülbahar Hatun'dur.","Çocukluk yıllarını Amasya'da geçirdi. Şehzadeliği sırasında devlet yönetimi, askerlik, edebiyat ve dinî ilimler alanlarında eğitim aldı.","Genç yaşta Amasya sancak beyliği görevine getirildi. Burada devlet yönetimi konusunda deneyim kazandı.","Babası Fatih Sultan Mehmed'in 1481 yılında vefat etmesinin ardından Osmanlı tahtına çıktı.","Tahta çıkış sürecinde kardeşi Cem Sultan ile mücadele etmek zorunda kaldı. Cem Sultan, Osmanlı tahtında hak iddia ederek kendisine bağlı kuvvetlerle mücadele etti.","Cem Sultan'ın yenilerek Avrupa'ya gitmesinden sonra da taht mücadelesi sona ermedi. Cem Sultan'ın Avrupa'da tutulması, Osmanlı Devleti'nin dış politikasını uzun süre etkiledi.","II. Bayezid, saltanatının ilk yıllarında devlet içerisindeki siyasi dengeleri sağlamlaştırmaya çalıştı.","1484 yılında Boğdan üzerine sefere çıktı. Kili ve Akkerman kalelerini ele geçirerek Karadeniz'in kuzeybatısındaki Osmanlı hâkimiyetini güçlendirdi.","Kili ve Akkerman'ın alınması, Osmanlı Devleti'nin Karadeniz ticaret yolları üzerindeki kontrolünü artırdı.","1485 yılında Memlük Devleti ile Osmanlı Devleti arasında savaş başladı. Bu mücadele, Çukurova ve çevresindeki hâkimiyet anlaşmazlıklarından kaynaklandı.","Osmanlı-Memlük Savaşı 1491 yılına kadar devam etti. Savaşın sonunda iki devlet arasında kesin bir üstünlük sağlanamadı ve barış yapıldı.","1492 yılında İspanya'da Müslümanların ve Yahudilerin karşılaştığı baskılar üzerine Osmanlı Devleti yardım faaliyetlerinde bulundu. Osmanlı donanması ve görevlileri, birçok Yahudinin Osmanlı topraklarına yerleşmesine yardımcı oldu.","1490'lı yıllarda Osmanlı Devleti, Venedik ile Akdeniz ve Ege Denizi'ndeki hâkimiyet mücadelesini sürdürdü.","1499-1503 yılları arasında Osmanlı-Venedik Savaşı yaşandı. Bu savaş sırasında Osmanlı donanması önemli başarılar elde etti.","1499 yılında İnebahtı, 1500 yılında Modon ve Koron kaleleri Osmanlı hâkimiyetine geçti. Bu gelişmeler Osmanlı Devleti'nin Akdeniz'deki gücünü artırdı.","II. Bayezid döneminde Osmanlı donanması gelişmeye devam etti. Akdeniz'de Osmanlı deniz gücünün daha etkili hâle gelmesi için çalışmalar yapıldı.","Doğu Anadolu ve İran çevresinde ortaya çıkan Safevi hareketi, saltanatının son dönemlerinde önemli bir siyasi sorun hâline geldi.","Safevi hükümdarı Şah İsmail'in Anadolu'daki etkisinin artması üzerine Osmanlı Devleti çeşitli önlemler aldı.","1509 yılında İstanbul'da büyük bir deprem meydana geldi. Tarihe Küçük Kıyamet olarak geçen bu depremde çok sayıda yapı zarar gördü.","II. Bayezid, depremden zarar gören İstanbul'un yeniden inşa edilmesi için çalışmalar başlattı.","Saltanatı sırasında camiler, medreseler, köprüler, imaretler ve diğer mimari eserler yaptırıldı.","Eğitim, bilim, edebiyat ve dinî çalışmaların gelişmesini destekledi. Döneminde birçok bilim insanı, şair ve sanatçı Osmanlı sarayında faaliyet gösterdi.","Kendisi de şiirle ilgilendi ve Adlî mahlasını kullandı. Şiirlerinde dinî ve tasavvufi konulara yer verdi.","II. Bayezid, Osmanlı Devleti'nin yönetiminde barış ve düzeni korumaya önem verdiği için bazı tarihçiler tarafından Yumuşak Huylu Bayezid olarak anılmıştır.","Saltanatının son yıllarında oğlu Şehzade Selim ile arasında taht mücadelesi başladı.","1512 yılında II. Bayezid tahttan çekildi ve yerine oğlu Yavuz Sultan Selim geçti.","II. Bayezid, 26 Mayıs 1512 tarihinde Dimetoka'ya giderken hayatını kaybetti. Ölümünün hastalık nedeniyle gerçekleştiği kabul edilir.","İstanbul'da kendi adına yaptırılan Bayezid Camii, günümüze ulaşan önemli mimari eserlerden biridir.","II. Bayezid, uzun süren saltanatı boyunca Osmanlı Devleti'nin siyasi, kültürel ve ekonomik yapısını geliştiren; donanmanın güçlenmesine ve İstanbul'un imarına katkı sağlayan padişahlardan biri olarak tarihe geçti."]},
{name:"III. Selim",category:"Osmanlı",info:["III. Selim, 24 Aralık 1761 tarihinde İstanbul'da doğdu. Babası III. Mustafa, annesi Mihrişah Sultan'dır.","Çocukluk yıllarını Osmanlı sarayında geçirdi. Babasının 1774 yılında vefat etmesinin ardından amcası I. Abdülhamid tahta çıktı.","Şehzadelik döneminde saray eğitimi aldı. Dinî ilimler, edebiyat, tarih, müzik ve devlet yönetimi alanlarında yetiştirildi.","Gençlik yıllarında devlet işleriyle yakından ilgilendi ve dönemin siyasi gelişmelerini takip etti.","III. Selim, 7 Nisan 1789 tarihinde I. Abdülhamid'in vefat etmesi üzerine Osmanlı tahtına çıktı.","Tahta çıktığında Osmanlı Devleti, Avusturya ve Rusya ile savaş hâlindeydi. Bu savaşlar devletin askerî ve ekonomik durumunu zorlaştırıyordu.","1791 yılında Avusturya ile Ziştovi Antlaşması imzalandı. Bu antlaşmayla Avusturya ile savaş sona erdi.","1792 yılında Rusya ile Yaş Antlaşması imzalandı. Böylece Osmanlı-Rus Savaşı sona erdi ve Kırım'ın Rusya'ya ait olduğu kabul edildi.","Savaşların ardından Osmanlı Devleti'nin askerî ve idari yapısında köklü yenilikler yapılması gerektiğini düşündü.","III. Selim döneminin en önemli yenilik hareketi Nizam-ı Cedid adıyla bilinir. Bu hareket, özellikle ordu ve devlet yönetiminde Avrupa'daki gelişmelerden yararlanmayı amaçlıyordu.","Nizam-ı Cedid kapsamında Avrupa usulünde eğitim alan yeni bir askerî birlik oluşturuldu.","Yeni ordunun ihtiyaçlarını karşılamak amacıyla İrad-ı Cedid adı verilen özel bir hazine kuruldu.","Askerî eğitim kurumları geliştirildi ve Avrupa'daki askerî gelişmeleri incelemek için çeşitli çalışmalar yapıldı.","Avrupa başkentlerinde sürekli Osmanlı elçilikleri açıldı. Böylece Osmanlı Devleti, Avrupa'daki siyasi ve bilimsel gelişmeleri daha yakından takip etmeye başladı.","1793 yılında Londra'da Yusuf Agâh Efendi'nin görevlendirilmesiyle ilk sürekli Osmanlı büyükelçiliği açıldı.","III. Selim, eğitim ve kültür alanında da yenilikleri destekledi. Mühendishane-i Berrî-i Hümâyun'un gelişmesine katkıda bulundu.","Fransız İhtilali'nin 1789 yılında başlaması Avrupa'daki siyasi dengeleri değiştirdi. Bu gelişmeler Osmanlı Devleti'nin dış politikasını da etkiledi.","1798 yılında Napolyon Bonapart komutasındaki Fransız ordusu Mısır'ı işgal etti. Osmanlı Devleti, Fransa'ya karşı İngiltere ve Rusya ile iş birliği yaptı.","1801 yılında Fransız kuvvetleri Mısır'dan çekildi. Böylece Mısır yeniden Osmanlı yönetimine döndü.","Nizam-ı Cedid yenilikleri, geleneksel askerî grupların ve bazı devlet adamlarının tepkisini çekti.","1806 yılında Osmanlı Devleti ile Rusya arasında yeni bir savaş başladı. Savaşın getirdiği sorunlar ve yeniliklere karşı oluşan tepkiler devlet yönetimini zorlaştırdı.","1807 yılında Kabakçı Mustafa İsyanı çıktı. İsyancılar Nizam-ı Cedid ordusunun kaldırılmasını istedi.","İsyanın ardından III. Selim tahttan indirildi ve yerine IV. Mustafa geçirildi.","Tahttan indirildikten sonra sarayda gözetim altında tutuldu. Yenilik hareketlerini destekleyen devlet adamları onu yeniden tahta çıkarmaya çalıştı.","1808 yılında Alemdar Mustafa Paşa'nın İstanbul'a gelmesiyle III. Selim'i yeniden tahta çıkarma girişimi başladı. Ancak bu girişim başarılı olamadı.","III. Selim, 28 Temmuz 1808 tarihinde hayatını kaybetti.","III. Selim aynı zamanda müziğe ve şiire büyük ilgi duyuyordu. İlhami mahlasıyla şiirler yazdı ve Türk musikisine önemli eserler kazandırdı.","Döneminde Osmanlı müziği gelişmeye devam etti. Kendisi de bestekâr olarak tanındı.","III. Selim, özellikle Nizam-ı Cedid hareketiyle Osmanlı Devleti'nde modernleşme ve yenileşme sürecinin önemli isimlerinden biri olarak tarihe geçti."]},
{name:"II. Mahmud",category:"Osmanlı",info:["II. Mahmud, 20 Temmuz 1785 tarihinde İstanbul'da doğdu. Babası I. Abdülhamid, annesi Nakşidil Sultan'dır.","Çocukluk yıllarını Osmanlı sarayında geçirdi. Saray eğitimi sırasında dinî ilimler, tarih, edebiyat, müzik ve devlet yönetimi konularında eğitim aldı.","Amcası III. Selim döneminde yapılan yenilikleri yakından takip etti. III. Selim'in modernleşme çalışmalarından etkilendiği kabul edilir.","1808 yılında Alemdar Mustafa Paşa'nın desteğiyle Osmanlı tahtına çıktı. Böylece Osmanlı Devleti'nin 30. padişahı oldu.","Tahta çıktığında Osmanlı Devleti siyasi karışıklıklar, askerî sorunlar ve merkezi otoritenin zayıflaması gibi önemli problemlerle karşı karşıyaydı.","Tahta çıkışından sonra Alemdar Mustafa Paşa sadrazam oldu. Devlet yönetiminde düzenlemeler yapmak amacıyla çalışmalar başlattı.","1808 yılında devlet adamları ile ayanlar arasında Sened-i İttifak imzalandı. Bu belge, Osmanlı tarihinde merkezi yönetim ile yerel güçler arasındaki ilişkiler bakımından önemli bir gelişmeydi.","Alemdar Mustafa Paşa'nın 1808 yılında çıkan Yeniçeri isyanı sırasında hayatını kaybetmesinden sonra II. Mahmud yönetimi doğrudan kontrol etmeye başladı.","1809 yılında İngiltere ile Kal'a-i Sultaniye Antlaşması imzalandı. Bu antlaşmayla İngiltere, barış zamanında Osmanlı boğazlarından savaş gemisi geçirmeme ilkesini kabul etti.","1812 yılında Rusya ile Bükreş Antlaşması imzalandı. Böylece Osmanlı-Rus Savaşı sona erdi ve Besarabya Rusya'ya bırakıldı.","II. Mahmud, Osmanlı Devleti'nin merkezî yönetimini güçlendirmek ve devlet kurumlarını yeniden düzenlemek amacıyla kapsamlı reformlar yaptı.","1821 yılında Mora'da Rum İsyanı başladı. İsyan zamanla genişledi ve Osmanlı Devleti'nin bölgedeki hâkimiyetini ciddi şekilde sarstı.","1826 yılında Yeniçeri Ocağı kaldırıldı. Bu olay Osmanlı tarihinde Vak'a-i Hayriye olarak anılır.","Yeniçeri Ocağı'nın kaldırılmasının ardından Asakir-i Mansure-i Muhammediye adı verilen yeni bir ordu kuruldu. Bu ordu, modern askerî yöntemlere göre düzenlendi.","Askerî yeniliklerin yanında devlet kurumlarında da değişiklikler yapıldı. Bakanlık benzeri yeni yönetim birimleri oluşturuldu.","1826 yılında Evkaf-ı Hümayun Nezareti kurularak vakıf işlerinin yönetiminde düzenleme yapıldı.","1827 yılında Avrupa tarzında eğitim veren Tıphane-i Amire ve Cerrahhane-i Mamure açıldı. Böylece modern tıp eğitiminin gelişmesi için önemli bir adım atıldı.","1827 yılında Navarin Deniz Savaşı'nda Osmanlı-Mısır donanması, İngiltere, Fransa ve Rusya'nın ortak filosu tarafından büyük ölçüde yok edildi.","1828-1829 Osmanlı-Rus Savaşı'nın ardından 1829 yılında Edirne Antlaşması imzalandı. Osmanlı Devleti, Balkanlar ve Karadeniz çevresinde önemli kayıplar yaşadı.","1830 yılında Fransa Cezayir'i işgal etti. Bu gelişme, Osmanlı Devleti'nin Kuzey Afrika'daki hâkimiyetini zayıflattı.","II. Mahmud döneminde Osmanlı-Mısır ilişkileri de önemli bir sorun hâline geldi. Mısır Valisi Kavalalı Mehmed Ali Paşa'nın güçlenmesi merkezi yönetimle çatışmaya yol açtı.","1831 yılında ilk Osmanlı nüfus sayımı gerçekleştirildi. Bu sayımda ağırlıklı olarak erkek nüfus kayıt altına alındı.","1831 yılında Takvim-i Vekayi adlı ilk resmî Osmanlı gazetesi yayımlanmaya başladı. Böylece devletin duyuruları ve gelişmeler halka daha düzenli biçimde aktarılabildi.","1833 yılında Kavalalı Mehmed Ali Paşa'nın kuvvetlerinin ilerlemesi üzerine Osmanlı Devleti ile Rusya arasında Hünkâr İskelesi Antlaşması imzalandı.","1833 yılında yapılan Kütahya Antlaşması ile Mısır Valisi Mehmed Ali Paşa'nın yönetimindeki topraklar genişledi.","1834 yılında Mekteb-i Harbiye kuruldu. Bu okul, modern subay yetiştirmek amacıyla eğitim vermeye başladı.","1836 yılında devlet yönetiminde yeni düzenlemeler yapıldı ve Hariciye ile Dahiliye gibi bakanlıkların temelleri oluşturuldu.","1839 yılında Tanzimat döneminin başlangıcını hazırlayan reform çalışmaları devam ediyordu. Ancak II. Mahmud, Tanzimat Fermanı'nın ilanını göremedi.","II. Mahmud döneminde kıyafet düzenlemeleri yapıldı. Devlet görevlileri için fes ve yeni kıyafetler kullanılmaya başlandı.","Eğitim alanında sıbyan mekteplerinin yanında rüştiye adı verilen yeni okulların temelleri atıldı. Avrupa dillerinin ve modern derslerin öğretimine önem verildi.","II. Mahmud, 1 Temmuz 1839 tarihinde İstanbul'da hayatını kaybetti. Ölümünden sonra yerine oğlu Abdülmecid tahta çıktı.","II. Mahmud, Yeniçeri Ocağı'nı kaldırması, modern ordu kurması ve devlet kurumlarını yeniden düzenlemesi nedeniyle Osmanlı tarihinin en önemli reformcu padişahlarından biri olarak kabul edilir."]},
{name:"Abdülmecid",category:"Osmanlı",info:["Abdülmecid, 25 Nisan 1823 tarihinde İstanbul'da doğdu. Babası Osmanlı padişahı II. Mahmud, annesi Bezmialem Valide Sultan'dır.","Çocukluk yıllarını Osmanlı sarayında geçirdi. Babası II. Mahmud'un gerçekleştirdiği yenilik hareketlerinin etkisi altında yetişti.","Saray eğitimi sırasında Türkçe, Arapça, Farsça ve Fransızca öğrendi. Ayrıca tarih, edebiyat ve devlet yönetimi alanlarında eğitim aldı.","Babası II. Mahmud'un 1 Temmuz 1839 tarihinde vefat etmesinin ardından henüz 16 yaşındayken Osmanlı tahtına çıktı.","Tahta çıktığında Osmanlı Devleti, Mısır Valisi Kavalalı Mehmed Ali Paşa ile ciddi bir mücadele içerisindeydi.","1839 yılında Nizip Savaşı'nda Osmanlı ordusu, Kavalalı Mehmed Ali Paşa'nın kuvvetlerine yenildi. Bu gelişme Osmanlı Devleti'nin siyasi durumunu zorlaştırdı.","Osmanlı donanmasının da Mısır kuvvetlerinin eline geçmesiyle devlet büyük bir kriz yaşadı.","Abdülmecid'in saltanatının en önemli gelişmelerinden biri Tanzimat Fermanı'nın ilan edilmesidir.","3 Kasım 1839 tarihinde Gülhane Parkı'nda Mustafa Reşid Paşa tarafından Tanzimat Fermanı okundu.","Tanzimat Fermanı ile Osmanlı Devleti'nde herkesin can, mal ve namus güvenliğinin korunması, vergilerin düzenli toplanması ve askerlik işlerinin belirli kurallara bağlanması amaçlandı.","Tanzimat Fermanı, Osmanlı Devleti'nde hukuk ve yönetim alanında modernleşme sürecinin önemli başlangıçlarından biri oldu.","1840 yılında Osmanlı Devleti, İngiltere, Avusturya, Prusya ve Rusya'nın desteğiyle Londra Antlaşması'nı imzaladı. Bu gelişme sonucunda Mısır meselesinde geçici bir çözüm sağlandı.","1841 yılında Londra Boğazlar Sözleşmesi imzalandı. Bu sözleşmeyle barış zamanında yabancı savaş gemilerinin Osmanlı Boğazlarından geçişi sınırlandırıldı.","Abdülmecid döneminde eğitim kurumlarının geliştirilmesine önem verildi. Modern eğitim veren okulların sayısı artırıldı.","1846 yılında Darülfünun kurulması için çalışmalar başlatıldı. Bu kurum, daha sonra modern Osmanlı yükseköğretiminin gelişmesinde önemli rol oynadı.","1847 yılında İstanbul'da ilk modern Osmanlı telgraf hattının kurulması için çalışmalar yapıldı. Telgraf sistemi daha sonraki yıllarda genişletildi.","1851 yılında Encümen-i Daniş kuruldu. Bu kurumun amacı bilimsel ve kültürel eserlerin hazırlanmasını ve Türkçenin gelişmesini desteklemekti.","Abdülmecid döneminde demir yolu, telgraf ve ulaşım alanlarında modernleşme çalışmaları hız kazandı.","1853 yılında Rusya ile Osmanlı Devleti arasında Kırım Savaşı başladı. Rusya'nın Osmanlı toprakları üzerindeki baskısı savaşın önemli nedenlerinden biriydi.","Osmanlı Devleti, Kırım Savaşı sırasında İngiltere, Fransa ve daha sonra Sardinya-Piyemonte ile ittifak yaptı.","1854 yılında Osmanlı Devleti ilk dış borcunu aldı. Bu borç, Kırım Savaşı'nın getirdiği ekonomik yükleri karşılamak amacıyla kullanıldı.","1856 yılında Paris Antlaşması imzalandı. Bu antlaşmayla Osmanlı Devleti Avrupa devletler hukukunun bir parçası olarak kabul edildi ve Osmanlı topraklarının bütünlüğü güvence altına alındı.","18 Şubat 1856 tarihinde Islahat Fermanı ilan edildi. Bu fermanla Müslüman ve gayrimüslim Osmanlı vatandaşlarının hakları konusunda yeni düzenlemeler yapılması amaçlandı.","Islahat Fermanı, özellikle gayrimüslim vatandaşların devlet memurluğu, eğitim ve hukuk alanlarındaki haklarının geliştirilmesini hedefliyordu.","Abdülmecid döneminde Dolmabahçe Sarayı'nın yapımına başlandı. Saray 1856 yılında tamamlandı ve padişahın kullanımına açıldı.","Dolmabahçe Sarayı, Avrupa mimarisinden etkilenen yapısıyla Osmanlı saray mimarisinde yeni bir dönemin simgelerinden biri oldu.","Abdülmecid, sanat ve müziğe ilgi duyuyordu. Özellikle Batı müziğini destekledi ve sarayda Avrupa tarzı müzik faaliyetlerine önem verdi.","1856 yılında İstanbul'da açılan Dolmabahçe Sarayı'nın yanı sıra Çırağan Sarayı'nın yapım çalışmaları da onun döneminde başladı.","Abdülmecid, 25 Haziran 1861 tarihinde İstanbul'da hayatını kaybetti. Ölümünün ardından kardeşi Abdülaziz tahta çıktı.","Abdülmecid, Tanzimat ve Islahat fermanlarının ilan edildiği, Osmanlı Devleti'nin hukuk, eğitim, yönetim ve ulaşım alanlarında önemli değişimler yaşadığı dönemin padişahı olarak tarihe geçti."]},
{name:"II. Abdülhamid",category:"Osmanlı",info:["II. Abdülhamid, 21 Eylül 1842 tarihinde İstanbul'da doğdu. Babası Sultan Abdülmecid, annesi Tirimüjgan Kadınefendi'dir.","Çocukluk yıllarını Osmanlı sarayında geçirdi. Küçük yaşta annesini kaybetti ve eğitiminde üvey annesi Piristû Kadınefendi'nin de önemli rolü oldu.","Şehzadelik döneminde dinî ilimler, tarih, edebiyat, siyaset ve yabancı diller üzerine eğitim aldı.","Türkçenin yanı sıra Arapça, Farsça ve Fransızca öğrendi. Ayrıca müzikle ilgilendi ve marangozluk gibi el sanatlarına merak duydu.","Babası Abdülmecid'in 1861 yılında vefat etmesinin ardından amcası Abdülaziz tahta çıktı.","Şehzadelik döneminde Avrupa'yı ziyaret etti. 1867 yılında amcası Abdülaziz'in Avrupa gezisine katılarak Avrupa devletlerini ve yönetim sistemlerini yakından tanıma fırsatı buldu.","Abdülaziz'in 1876 yılında tahttan indirilmesinin ardından V. Murad padişah oldu. Ancak V. Murad'ın sağlık sorunları nedeniyle tahttan ayrılması üzerine II. Abdülhamid Osmanlı tahtına çıktı.","31 Ağustos 1876 tarihinde Osmanlı Devleti'nin 34. padişahı oldu.","Tahta çıktığında Osmanlı Devleti ekonomik sıkıntılar, siyasi karışıklıklar ve Balkanlar'daki isyanlarla mücadele ediyordu.","23 Aralık 1876 tarihinde Kanun-ı Esasi ilan edildi. Böylece Osmanlı Devleti'nin ilk anayasası yürürlüğe girdi ve I. Meşrutiyet dönemi başladı.","1877 yılında Osmanlı-Rus Savaşı başladı. Tarihte 93 Harbi olarak bilinen bu savaş, Osmanlı Devleti açısından ağır sonuçlar doğurdu.","Savaş sırasında Osmanlı ordusu Balkanlar ve Kafkasya cephelerinde Rus kuvvetleriyle mücadele etti.","1878 yılında imzalanan Ayastefanos Antlaşması'nın yerine aynı yıl Berlin Antlaşması imzalandı. Bu antlaşmayla Osmanlı Devleti Balkanlar'da önemli toprak kayıpları yaşadı.","1878 yılında II. Abdülhamid, meclisi kapattı ve anayasayı askıya aldı. Böylece I. Meşrutiyet dönemi sona erdi.","II. Abdülhamid döneminde merkezi yönetim güçlendirildi. Devlet yönetimi büyük ölçüde saraydan yürütülmeye başlandı.","Eğitim alanında önemli çalışmalar yapıldı. İdadiler, rüştiyeler ve meslek okullarının sayısı artırıldı.","1881 yılında Muharrem Kararnamesi ilan edildi. Osmanlı Devleti'nin dış borçlarının yönetimi için Düyun-u Umumiye İdaresi kuruldu.","Düyun-u Umumiye İdaresi, Osmanlı Devleti'nin bazı vergi gelirlerini doğrudan kontrol ederek dış borçların ödenmesini sağladı.","1881 yılında Fransa, Tunus'u işgal etti. Bu gelişme Osmanlı Devleti'nin Kuzey Afrika'daki nüfuzunu daha da azalttı.","1882 yılında İngiltere Mısır'ı işgal etti. Mısır hukuken Osmanlı toprağı olarak kalsa da İngiliz kontrolüne girdi.","II. Abdülhamid döneminde demir yolu projelerine büyük önem verildi. Özellikle Hicaz Demiryolu projesi Müslüman dünyası açısından önemli bir girişim oldu.","Hicaz Demiryolu'nun yapımına 1900 yılında başlandı. Demir yolu, İstanbul ile Hicaz bölgesi arasındaki ulaşımı kolaylaştırmayı ve hac yolculuğunu desteklemeyi amaçlıyordu.","1908 yılında tamamlanan Hicaz Demiryolu, dönemin en önemli ulaşım projelerinden biri olarak tarihe geçti.","1889 yılında İstanbul'da Mekteb-i Tıbbiye-i Şahane binasının yapımı tamamlandı. Bu kurum modern tıp eğitiminin gelişmesine katkı sağladı.","II. Abdülhamid döneminde İstanbul'da ve Anadolu'nun çeşitli bölgelerinde hastaneler, okullar, kütüphaneler ve kamu binaları açıldı.","1890 yılında İstanbul'da Darülaceze'nin kuruluş çalışmaları başladı. Kurum, ihtiyaç sahibi insanlara bakım ve yardım sağlamak amacıyla oluşturuldu.","1892 yılında İstanbul'da Hamidiye Etfal Hastanesi açıldı. Bu hastane, çocuk sağlığı alanında önemli bir kurum hâline geldi.","1894 yılında İstanbul'da büyük bir deprem meydana geldi. Deprem sonrasında şehirde onarım ve yeniden düzenleme çalışmaları yapıldı.","1897 yılında Osmanlı Devleti ile Yunanistan arasında savaş yaşandı. Dömeke Muharebesi'nde Osmanlı ordusu önemli bir başarı kazandı.","1898 yılında Alman İmparatoru II. Wilhelm İstanbul'u ziyaret etti. Bu ziyaret, Osmanlı-Alman ilişkilerinin gelişmesinde etkili oldu.","II. Abdülhamid döneminde Osmanlı Devleti ile Almanya arasındaki siyasi, askerî ve ekonomik ilişkiler güçlendi.","1908 yılında İttihat ve Terakki Cemiyeti'nin baskısı ve askerî hareketlenmeler sonucunda II. Meşrutiyet yeniden ilan edildi. Kanun-ı Esasi tekrar yürürlüğe girdi ve meclis yeniden açıldı.","13 Nisan 1909 tarihinde İstanbul'da 31 Mart Vakası olarak bilinen olay yaşandı. İsyan, Hareket Ordusu tarafından bastırıldı.","27 Nisan 1909 tarihinde II. Abdülhamid tahttan indirildi. Yerine kardeşi V. Mehmed Reşad padişah oldu.","Tahttan indirildikten sonra Selanik'te Alatini Köşkü'nde gözetim altında tutuldu. 1912 yılında İstanbul'a getirildi.","II. Abdülhamid, 10 Şubat 1918 tarihinde İstanbul'da hayatını kaybetti. Sultan II. Mahmud Türbesi'ne defnedildi.","II. Abdülhamid, uzun saltanatı boyunca eğitim, sağlık, ulaşım ve haberleşme alanlarında önemli projelere imza attı. Bununla birlikte yönetim anlayışı, meclisin kapatılması ve siyasi baskılar nedeniyle tarihçiler arasında farklı değerlendirmelere konu oldu."]},
  
];

const listDiv = document.getElementById('list');
let currentCategory = "all";

function renderList(arr){
  listDiv.innerHTML='';
  arr.forEach(p=>{
    const d=document.createElement('div');
    d.className='person';
    d.innerText=p.name;
    d.onclick=()=>openDetail(p);
    listDiv.appendChild(d);
  });
}

function openDetail(p){
  document.getElementById('detailPage').style.display='block';
  document.getElementById('detailName').innerText=p.name;
  const ol=document.getElementById('detailInfo');
  ol.innerHTML='';
  p.info.forEach(i=>{
    const li=document.createElement('li');
    li.innerText=i;
    ol.appendChild(li);
  });
}

function closeDetail(){
  document.getElementById('detailPage').style.display='none';
}

function filterCategory(cat){
  currentCategory = cat;
  applyFilters();
}

function searchPerson(){
  applyFilters();
}

function applyFilters(){
  const val=document.getElementById('searchBox').value.toLowerCase();
  let result=people;

  if(currentCategory!=="all"){
    result=result.filter(p=>p.category===currentCategory);
  }

  result=result.filter(p=>p.name.toLowerCase().includes(val));
  renderList(result);
}

renderList(people);
  console.log(people);
console.log("Kişi sayısı:", people.length);
